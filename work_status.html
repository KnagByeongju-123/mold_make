<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<title>업무현황 v1.0 · 금형제작관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117; --card:#1a1d27; --card2:#161925; --line:#3a4152; --line2:#2a3040;
  --ink:#e8eaf0; --sub:#aab0c4; --gray:#8a92a8;
  --gold:#e2b04a; --gold2:#f6d365; --gold3:#fda085;
  --goldbg:rgba(226,176,74,.12); --goldbd:rgba(226,176,74,.4);
  --blue:#4f8cff; --red:#ff7b7b; --green:#7ee0a0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow-x:hidden}
.mono{font-family:'IBM Plex Mono',monospace}
.gold-txt{background:linear-gradient(120deg,var(--gold2),var(--gold),var(--gold3),var(--gold2));
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:250% center}}

header{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#181b26,#0f1117ee);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:11px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:17px;cursor:pointer;flex-shrink:0}
.back:active{transform:scale(.94)}
h1{font-size:17px;font-weight:900;letter-spacing:-.3px;flex:1}
h1 .rev{font-size:10px;color:var(--sub);border:1px solid var(--line);padding:1px 6px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;white-space:nowrap;opacity:.7;margin-left:6px;vertical-align:middle}
.ubadge{font-size:11px;font-weight:800;color:var(--gold);border:1px solid var(--goldbd);
  background:var(--goldbg);padding:3px 12px;border-radius:14px;white-space:nowrap}

.datebar{display:flex;align-items:center;gap:6px;margin-top:10px}
.dbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:7px 12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.dbtn:active{transform:scale(.95)}
.dbtn.today{color:var(--gold);border-color:var(--goldbd);background:var(--goldbg)}
input[type=date]{flex:1;background:var(--card2);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:7px 8px;font-size:14px;font-family:inherit}
.livebar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(126,224,160,.6)}
.dot.off{background:var(--gray);box-shadow:none}
.livebar .sw{margin-left:auto;display:flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--sub);background:var(--card);
  font-family:inherit;font-size:11px;font-weight:700}
.livebar .sw + .sw{margin-left:0}

.container{padding:10px 14px 120px;max-width:820px;margin:0 auto}

details.panel{background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.panel>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:800;color:var(--sub)}
details.panel>summary::-webkit-details-marker{display:none}
.panel-body{padding:0 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--sub);
  border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.srch{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:8px 10px;font-size:14px;font-family:inherit}
.srch:focus{outline:none;border-color:var(--goldbd)}

.stat{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.sbadge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;
  border:1px solid var(--line2);background:var(--card);color:var(--sub)}

.ordbar{display:none;align-items:center;gap:8px;margin-bottom:8px;
  background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.35);
  border-radius:10px;padding:8px 10px;font-size:12px;color:var(--blue);font-weight:700}
body.ordmode .ordbar{display:flex}
.ordbar .r{margin-left:auto;display:flex;gap:6px}

.card{display:flex;align-items:stretch;gap:10px;
  background:var(--card);border:1px solid var(--line2);
  border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;
  transition:border-color .18s,background .18s,transform .1s}
.card:active{transform:scale(.99)}
.card.filled{border-color:rgba(126,224,160,.35)}
.card .bar{width:4px;border-radius:3px;background:var(--line);flex:0 0 4px}
.card .body{flex:1;min-width:0}
.cmbtn{flex:0 0 auto;align-self:center;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:44px}
.cmbtn button{border:1px solid var(--line2);border-radius:9px;background:rgba(255,255,255,.03);color:var(--sub);font-size:12px;cursor:pointer;padding:6px 8px;line-height:1;font-family:inherit}
.cmbtn button:active{transform:scale(.94)}
.cmbtn .rx{font-size:9.5px;color:var(--gray);display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.cmbtn .rx b{font-weight:700}
/* 코멘트 시트 */
#cmask{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.25s;z-index:120}
#cmask.on{opacity:1;visibility:visible}
#csheet{position:fixed;left:0;right:0;bottom:0;z-index:121;background:#171b26;border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:16px 16px 22px;max-height:78vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1)}
#csheet.on{transform:none}
#csheet h3{margin:0 0 2px;font-size:15px}
#csheet .sub2{font-size:11px;color:var(--gray);margin-bottom:10px}
.rxrow{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rxrow button{flex:1;min-width:80px;padding:10px 0;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.rxrow button.on{border-color:#7ee0a0;color:#7ee0a0;background:rgba(126,224,160,.1)}
.rxrow button .cnt2{font-size:10px;opacity:.75;font-weight:600}
.cmt{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.cmt .ch{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--gray)}
.cmt .ch b{color:var(--ink);font-size:12px}
.cmt .cb2{font-size:13px;margin-top:4px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cmt .cdel{margin-left:auto;background:none;border:none;color:var(--gray);cursor:pointer;font-size:12px}
.cmt .cdel:hover{color:#ff7b7b}
.cin{display:flex;gap:7px;margin-top:10px}
.cin input{flex:1;min-width:0;background:#10141d;border:1px solid var(--line2);border-radius:11px;color:var(--ink);padding:11px 12px;font-size:13px;font-family:inherit}
.cin input:focus{outline:none;border-color:#7ee0a0}
.cin button{flex:0 0 auto;padding:0 16px;border-radius:11px;border:1px solid rgba(126,224,160,.45);background:rgba(126,224,160,.14);color:#7ee0a0;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.card .top{display:flex;align-items:center;gap:6px}
.card .nm{font-size:14px;font-weight:800;color:var(--ink)}
.card .st{font-size:10px;font-weight:900;padding:2px 8px;border-radius:8px;margin-left:auto}
.card .ct{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.45;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ct.empty{color:var(--gray);font-style:italic}
.card .ft{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10.5px;color:var(--gray)}
.pg{flex:1;height:4px;background:var(--line2);border-radius:3px;overflow:hidden;max-width:120px}
.pg>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green))}

.card.ord{cursor:grab;border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.05)}
.card.ord.dragging{opacity:.4}
.card .mv{display:none;flex-direction:column;gap:4px;justify-content:center;flex:0 0 34px}
body.ordmode .card .mv{display:flex}
.card .mv button{width:34px;height:26px;border-radius:7px;cursor:pointer;font-family:inherit;
  background:var(--card2);border:1px solid rgba(79,140,255,.4);
  color:var(--blue);font-size:12px;font-weight:900;padding:0}
.card .mv button:active{transform:scale(.92)}
.card .hd{display:none;align-items:center;color:var(--blue);font-size:16px;flex:0 0 16px}
body.ordmode .card .hd{display:flex}

.empty-msg{text-align:center;color:var(--gray);font-size:13px;padding:40px 10px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(180deg,#1c2030,#141721);
  border-top:1px solid var(--goldbd);
  border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .22s ease;
  max-height:88vh;overflow-y:auto;max-width:820px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-h .n{font-size:16px;font-weight:900;color:var(--ink)}
.sh-h .m{font-size:11px;color:var(--sub)}
.sh-h .x{margin-left:auto;background:transparent;border:none;color:var(--sub);font-size:22px;cursor:pointer}
.lbl{font-size:11px;font-weight:800;color:var(--sub);margin:12px 0 6px;letter-spacing:.3px}
textarea,.ip{width:100%;background:var(--card2);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
textarea{min-height:96px;resize:vertical;line-height:1.5}
textarea:focus,.ip:focus{outline:none;border-color:var(--goldbd)}
.savebar{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border-radius:11px;padding:12px;font-size:15px;font-weight:900;
  cursor:pointer;font-family:inherit;border:1px solid}
.btn.save{background:linear-gradient(135deg,rgba(226,176,74,.25),rgba(246,211,101,.2));
  border-color:var(--goldbd);color:var(--gold2)}
.btn.cancel{flex:0 0 90px;background:var(--card);border-color:var(--line);color:var(--sub)}
.btn:active{transform:scale(.98)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#141721;border:1px solid var(--goldbd);color:var(--gold2);
  padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;z-index:99;
  opacity:0;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 상단 도구 메뉴 위치(순서) 편집 ===== */
.menuordbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  font-family:inherit;transition:.15s;padding:0;flex-shrink:0}
.menuordbtn:hover,.menuordbtn.on{border-color:var(--goldbd);background:var(--goldbg);color:var(--gold)}
.menuordbtn:active{transform:scale(.94)}
.menueditnote{display:none;margin:8px 0 0;padding:9px 10px;border:1px solid var(--goldbd);border-radius:9px;
  background:var(--goldbg);color:var(--gold);font-size:11.5px;line-height:1.45}
.menueditbar{display:none;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.menueditbar button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);
  background:var(--card2);color:var(--sub);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.menueditbar .mreset{color:var(--red);border-color:rgba(255,123,123,.4)}
.menueditbar .mdone{color:#241a05;border-color:var(--gold);background:linear-gradient(160deg,var(--gold2),var(--gold))}
body.menu-editing .menueditnote{display:block}
body.menu-editing .menueditbar{display:flex}
#toolChips .chip{position:relative}
#toolChips .chip .mordhandle{display:none;margin-left:6px;font-size:12px;font-weight:900;color:var(--gold);line-height:1}
body.menu-editing #toolChips .chip{border-style:dashed;border-color:var(--goldbd);color:var(--gold);
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
body.menu-editing #toolChips .chip .mordhandle{display:inline}
#toolChips .chip.menu-dragging{opacity:.94;transform:scale(1.05);background:rgba(226,176,74,.18);
  box-shadow:inset 0 0 0 1px var(--gold);filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
#toolChips .chip.menu-drop-before{box-shadow:-3px 0 0 var(--gold)}

/* ===== PC 화면 폭 조절 (📐) — 모바일(760px 이하)에서는 비활성 ===== */
.pcwmenu{display:none}
@media(min-width:761px){
  header{padding-left:max(14px,calc((100vw - var(--pcw,1020px)) / 2 + 14px));
         padding-right:max(14px,calc((100vw - var(--pcw,1020px)) / 2 + 14px));
         transition:padding .18s ease}
  .container{max-width:min(var(--pcw,1020px),calc(100vw - 28px));transition:max-width .12s ease}
  .sheet{max-width:min(var(--pcw,1020px),calc(100vw - 28px))}
  #csheet{max-width:min(var(--pcw,1020px),calc(100vw - 28px));margin:0 auto}
  .pcwmenu{display:block;position:relative;flex-shrink:0}
  .pcwbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
    font-family:inherit;transition:.15s;padding:0}
  .pcwbtn:hover,.pcwbtn.on{border-color:var(--goldbd);background:var(--goldbg);color:var(--gold)}
  .pcwpopup{position:absolute;right:0;top:calc(100% + 10px);width:300px;padding:13px 14px 12px;
    border:1px solid #4a5268;border-radius:13px;background:#171a24;box-shadow:0 14px 38px rgba(0,0,0,.55);
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
    transition:opacity .14s ease,transform .14s ease,visibility .14s;z-index:150;color:var(--ink)}
  .pcwpopup.show{opacity:1;visibility:visible;transform:none}
  .pcwpopup:before{content:'';position:absolute;right:9px;top:-6px;width:10px;height:10px;background:#171a24;
    border-left:1px solid #4a5268;border-top:1px solid #4a5268;transform:rotate(45deg)}
  .pcwpophead{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line2)}
  .pcwpophead b{font-size:12.5px;color:var(--gold);font-weight:800}
  .pcwclose{margin-left:auto;width:24px;height:24px;border:none;background:transparent;color:var(--gray);
    font-size:17px;line-height:1;cursor:pointer;border-radius:6px}
  .pcwclose:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .pcwrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11.5px;color:var(--sub)}
  .pcwrow b{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px}
  .pcwrange{width:100%;height:24px;accent-color:var(--gold);cursor:pointer;display:block}
  .pcwscale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--gray);
    font-family:'IBM Plex Mono',monospace;margin-top:-2px}
  .pcwfoot{display:flex;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
  .pcwsaved{font-size:10.5px;color:var(--green);white-space:nowrap}
  .pcwreset{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card2);
    color:var(--sub);font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pcwreset:hover{border-color:var(--goldbd);color:var(--gold)}
}
@media(max-width:760px){
  .ubadge{max-width:96px;overflow:hidden;text-overflow:ellipsis}
  h1{font-size:15.5px}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="back" id="btnBack">←</button>
    <h1><span class="gold-txt">업무현황</span> <span class="rev">v1.0</span></h1>
    <span class="ubadge" id="meLabel"></span>
    <button id="menuOrderBtn" class="menuordbtn" type="button" title="상단 도구 메뉴 위치 편집"
      aria-label="상단 도구 메뉴 위치 편집" aria-pressed="false" onclick="toggleMenuEdit(event)">☷</button>
    <div class="pcwmenu" id="pcWidthMenu">
      <button id="pcWidthBtn" class="pcwbtn" type="button" title="PC 화면 폭 설정"
        aria-label="PC 화면 폭 설정" aria-expanded="false" onclick="togglePCWidthPopup(event)">📐</button>
      <div id="pcWidthPopup" class="pcwpopup" role="dialog" aria-label="PC 화면 폭 설정" onclick="event.stopPropagation()">
        <div class="pcwpophead">
          <b>업무현황 화면 설정</b>
          <button class="pcwclose" type="button" aria-label="닫기" onclick="closePCWidthPopup()">×</button>
        </div>
        <div class="pcwrow"><span>화면 폭</span><b id="pcwValue">1020px</b></div>
        <input id="pcwRange" class="pcwrange" type="range" min="720" max="1400" step="20" value="1020"
          aria-label="PC 화면 폭 조절" oninput="previewPCWidth(this.value)" onchange="savePCWidth(this.value)">
        <div class="pcwscale"><span>720px</span><span>1400px</span></div>
        <div class="pcwfoot">
          <span id="pcwSaved" class="pcwsaved">저장됨</span>
          <button class="pcwreset" type="button" onclick="resetPCWidth()">기본값으로</button>
        </div>
      </div>
    </div>
  </div>
  <div class="datebar">
    <button class="dbtn" id="btnPrev">◀</button>
    <input type="date" id="dt">
    <button class="dbtn" id="btnNext">▶</button>
    <button class="dbtn today" id="btnToday">오늘</button>
  </div>
  <div class="livebar">
    <span class="dot" id="liveDot"></span>
    <span id="liveTxt">동기화 준비중</span>
    <button class="sw" id="btnSync">⟳ 새로고침</button>
    <button class="sw" id="btnLive">🔄 자동 ON</button>
  </div>
</header>

<div class="container">
  <details class="panel" id="fpanel">
    <summary>🔍 필터 · 도구</summary>
    <div class="panel-body">
      <input class="srch" id="srch" type="search" placeholder="이름 검색">
      <div class="menueditnote" id="menuEditNote">☷ 편집 중 — 도구 버튼을 잡아 원하는 위치로 끌어 옮기세요. 순서는 이 브라우저에 자동 저장됩니다.</div>
      <div class="chips" id="toolChips" style="margin-top:8px">
        <button class="chip" id="btnOnlyFilled" data-menu-id="filled">✍ 입력된 인원만<span class="mordhandle">☰</span></button>
        <button class="chip" id="btnOrder" data-menu-id="order">↕ 순서편집<span class="mordhandle">☰</span></button>
        <button class="chip" id="btnOrderReset" data-menu-id="orderreset">↺ 순서초기화<span class="mordhandle">☰</span></button>
        <button class="chip" id="btnReloadUsers" data-menu-id="reload">👥 인원 새로고침<span class="mordhandle">☰</span></button>
        <button class="chip" id="btnCsv" data-menu-id="csv">⬇ CSV<span class="mordhandle">☰</span></button>
      </div>
      <div class="menueditbar" id="menuEditBar">
        <button class="mreset" type="button" onclick="resetMenuOrder(event)">기본 순서</button>
        <button class="mdone" type="button" onclick="completeMenuEdit(event)">완료</button>
      </div>
    </div>
  </details>

  <div class="ordbar" id="ordbar">
    <span>↕ 순서편집 중 — ▲▼ 로 이동 (PC는 드래그) · 이 기기에만 저장됩니다</span>
    <span class="r"><button class="chip" id="btnOrderDone">완료</button></span>
  </div>

  <div class="stat" id="stat"></div>
  <div id="list"></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sh-h">
    <div>
      <div class="n" id="shName">-</div>
      <div class="m" id="shMeta">-</div>
    </div>
    <button class="x" id="shClose">✕</button>
  </div>
  <div class="lbl">근무 상태</div>
  <div class="chips" id="shStatus"></div>
  <div class="lbl">업무 내용</div>
  <textarea id="shContent" placeholder="오늘 진행한 업무를 입력하세요"></textarea>
  <div class="lbl">진행률</div>
  <div class="chips" id="shProg"></div>
  <div class="lbl">비고 / 특이사항</div>
  <input class="ip" id="shNote" placeholder="협조요청, 이슈 등">
  <div class="savebar">
    <button class="btn cancel" id="shCancel">닫기</button>
    <button class="btn save" id="shSave">저장</button>
  </div>
</div>

<div id="cmask" onclick="closeCmt()"></div>
<div id="csheet">
  <h3 id="cm-name"></h3>
  <div class="sub2" id="cm-meta"></div>
  <div class="rxrow" id="cm-rx"></div>
  <div id="cm-list"></div>
  <div class="cin">
    <input id="cm-input" placeholder="코멘트 입력 (Enter 전송)" onkeydown="if(event.key==='Enter')sendCmt()">
    <button onclick="sendCmt()">전송</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 설정 (금형제작관리 전용) ================= */
const BASE = "https://pllwltojbofjaftcemvn.supabase.co";
const KEY  = "sb_publishable_9dYJzdz472b888EcqdBBaA_Ncwk0yvT";
const TBL_USER = 'mm_user';
const TBL_WS   = 'hc_work_status';
const MASTER_KEY = '__MASTER__';
const CK_USERS = 'hcws_users_cache';
const CK_ORDER = 'hcws_user_order';     // 배치순서 (이 기기 전용)
const CK_USERS_TTL = 12*60*60*1000;
const POLL_MS = 600000;                 // 10분 증분 폴링

const HDR  = {'apikey':KEY,'Authorization':'Bearer '+KEY};
const HDRJ = Object.assign({'Content-Type':'application/json'}, HDR);

const STATUS = [
  {k:'근무', c:'#7ee0a0'}, {k:'외근', c:'#4f8cff'}, {k:'출장', c:'#b48be8'},
  {k:'교육', c:'#e2b04a'}, {k:'회의', c:'#f0a04b'}, {k:'휴가', c:'#8a92a8'},
  {k:'조퇴', c:'#fda085'}, {k:'결근', c:'#ff7b7b'}
];
const PROGS = [0,25,50,75,100];
const scolor = k => (STATUS.find(s=>s.k===k)||{c:'#3a4152'}).c;

/* ================= 상태 ================= */
let USER = (function(){
  try{
    const o=JSON.parse(localStorage.getItem('mm_session')||'null');
    if(o&&o.exp>Date.now()){
      localStorage.setItem('mm_session',JSON.stringify({name:o.name,exp:Date.now()+7*864e5}));
      sessionStorage.setItem('mm_user',o.name);
      return o.name;
    }
    if(o)localStorage.removeItem('mm_session');
  }catch(e){}
  return sessionStorage.getItem('mm_user') || null;
})();
let users = [];
let rows = {};
let els  = {};
let curDate = '';
let lastSync = null;
let liveOn = true;
let timer = null;
let fQry = '', fFilled = false;
let orderMode = false, dragId = null;
let editUser = null, edStatus = '근무', edProg = 0;

/* ================= 유틸 ================= */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1800);
}
function hhmm(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ================= 인원 마스터 (mm_user) ================= */
async function loadUsers(force){
  if(!force){
    try{
      const c = JSON.parse(localStorage.getItem(CK_USERS)||'null');
      if(c && c.t && (Date.now()-c.t) < CK_USERS_TTL && Array.isArray(c.list) && c.list.length){
        users = c.list; applyOrder(); return;
      }
    }catch(e){}
  }
  const r = await fetch(BASE+'/rest/v1/'+TBL_USER+'?select=id,name&order=name.asc', {headers:HDR});
  if(!r.ok) throw new Error('인원 조회 실패');
  const list = (await r.json()).filter(u=>u && u.name && u.name !== MASTER_KEY);
  users = list;
  try{ localStorage.setItem(CK_USERS, JSON.stringify({t:Date.now(), list})); }catch(e){}
  applyOrder();
}

/* ================= 배치순서 (localStorage / 기기별) ================= */
function loadOrder(){
  try{
    const a = JSON.parse(localStorage.getItem(CK_ORDER)||'null');
    return Array.isArray(a) ? a : null;
  }catch(e){ return null; }
}
function saveOrder(){
  try{ localStorage.setItem(CK_ORDER, JSON.stringify(users.map(u=>u.id))); }catch(e){}
}
function applyOrder(){
  const ord = loadOrder();
  if(!ord || !ord.length) return;
  const idx = {};
  ord.forEach((id,i)=>{ idx[id] = i; });
  users.sort((a,b)=>{
    const ia = (idx[a.id]===undefined) ? 99999 : idx[a.id];
    const ib = (idx[b.id]===undefined) ? 99999 : idx[b.id];
    if(ia !== ib) return ia - ib;
    return (a.name||'').localeCompare(b.name||'');
  });
}
function resetOrder(){
  if(!confirm('배치순서를 기본(이름순)으로 되돌립니다.')) return;
  localStorage.removeItem(CK_ORDER);
  loadUsers(true).then(()=>{ render(); toast('순서 초기화'); })
                 .catch(()=>toast('초기화 실패'));
}
function moveUser(u, dir){
  const vs = visibleUsers();
  const i = vs.findIndex(x=>x.id===u.id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= vs.length) return;
  const a = users.indexOf(u), b = users.indexOf(vs[j]);
  users[a] = vs[j]; users[b] = u;
  saveOrder(); render();
  const el = els[u.id];
  if(el) el.scrollIntoView({block:'center'});
}
function dropOn(targetId){
  if(!dragId || dragId === targetId) return;
  const from = users.findIndex(u=>u.id===dragId);
  if(from < 0) return;
  const moved = users.splice(from,1)[0];
  const to = users.findIndex(u=>u.id===targetId);
  users.splice(to < 0 ? users.length : to, 0, moved);
  dragId = null;
  saveOrder(); render();
}
function setOrderMode(on){
  orderMode = on;
  document.body.classList.toggle('ordmode', on);
  document.getElementById('btnOrder').classList.toggle('on', on);
  render();
}

/* ================= 코멘트 · 확인/검토 ================= */
const TBL_CM='hc_work_comment';
const RX=[{k:'확인',ic:'👁'},{k:'검토',ic:'🔍'},{k:'수고',ic:'👍'}];
let cmts={};      // target_user_id -> [rows]
let cmUser=null;  // 열려있는 대상

async function loadCmts(){
  try{
    const r=await fetch(BASE+'/rest/v1/'+TBL_CM+'?select=*&work_date=eq.'+curDate+'&order=created_at',{headers:HDR});
    if(!r.ok){cmts={};return}
    const list=await r.json();
    cmts={};
    list.forEach(x=>{(cmts[x.target_user_id]=cmts[x.target_user_id]||[]).push(x)});
  }catch(e){cmts={}}
}
function cmOf(uid){return cmts[uid]||[]}
function rxCount(uid,k){return cmOf(uid).filter(x=>x.reaction===k).length}
function myRx(uid,k){return cmOf(uid).find(x=>x.reaction===k&&x.author===USER)}
function cmCount(uid){return cmOf(uid).filter(x=>x.comment&&x.comment.trim()).length}

function paintCmBadge(u){
  const el=els[u.id];if(!el)return;
  const bx=el.querySelector('.cmbtn');if(!bx)return;
  const cm=cmCount(u.id);
  bx.querySelector('button').textContent='💬'+(cm?cm:'');
  const rxTxt=RX.map(r=>{const n=rxCount(u.id,r.k);return n?r.ic+'<b>'+n+'</b>':''}).filter(Boolean).join(' ');
  bx.querySelector('.rx').innerHTML=rxTxt;
}
function paintAllCm(){users.forEach(u=>paintCmBadge(u))}

function openCmt(u){
  cmUser=u;
  document.getElementById('cm-name').textContent='💬 '+u.name+' 님 업무 코멘트';
  document.getElementById('cm-meta').textContent=curDate+' · 확인·검토 체크와 코멘트는 모두에게 공유됩니다';
  document.getElementById('cm-input').value='';
  drawCmt();
  document.getElementById('cmask').classList.add('on');
  document.getElementById('csheet').classList.add('on');
}
function closeCmt(){
  document.getElementById('cmask').classList.remove('on');
  document.getElementById('csheet').classList.remove('on');
  cmUser=null;
}
function drawCmt(){
  if(!cmUser)return;
  const uid=cmUser.id;
  // 반응 버튼
  document.getElementById('cm-rx').innerHTML=RX.map(r=>{
    const n=rxCount(uid,r.k),mine=!!myRx(uid,r.k);
    const who=cmOf(uid).filter(x=>x.reaction===r.k).map(x=>x.author).join(', ');
    return `<button class="${mine?'on':''}" onclick="toggleRx('${r.k}')" title="${who}">${r.ic} ${r.k} <span class="cnt2">${n||''}</span></button>`;
  }).join('');
  // 코멘트 목록
  const list=cmOf(uid).filter(x=>x.comment&&x.comment.trim());
  document.getElementById('cm-list').innerHTML=list.map(x=>`<div class="cmt">
    <div class="ch"><b>${escHtml(x.author)}</b><span>${hhmm(x.created_at)}</span>
      ${(x.author===USER||USER==='관리자')?`<button class="cdel" onclick="delCmt(${x.id})">✕</button>`:''}</div>
    <div class="cb2">${escHtml(x.comment)}</div>
  </div>`).join('')||'<div style="font-size:12px;color:var(--gray);padding:8px 2px">아직 코멘트가 없습니다</div>';
}
function escHtml(t){return (t??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function toggleRx(kind){
  if(!cmUser||!USER)return;
  const mine=myRx(cmUser.id,kind);
  try{
    if(mine){
      await fetch(BASE+'/rest/v1/'+TBL_CM+'?id=eq.'+mine.id,{method:'DELETE',headers:HDR});
    }else{
      const r=await fetch(BASE+'/rest/v1/'+TBL_CM,{method:'POST',
        headers:Object.assign({'Prefer':'return=representation'},HDRJ),
        body:JSON.stringify({work_date:curDate,target_user_id:cmUser.id,target_user_name:cmUser.name,
          author:USER,reaction:kind,comment:null})});
      if(!r.ok)throw new Error(await r.text());
    }
    await loadCmts();drawCmt();paintCmBadge(cmUser);
  }catch(e){alert('처리 실패\n'+(e.message||e))}
}
async function sendCmt(){
  if(!cmUser||!USER)return;
  const v=document.getElementById('cm-input').value.trim();
  if(!v)return;
  try{
    const r=await fetch(BASE+'/rest/v1/'+TBL_CM,{method:'POST',
      headers:Object.assign({'Prefer':'return=representation'},HDRJ),
      body:JSON.stringify({work_date:curDate,target_user_id:cmUser.id,target_user_name:cmUser.name,
        author:USER,reaction:null,comment:v})});
    if(!r.ok)throw new Error(await r.text());
    document.getElementById('cm-input').value='';
    await loadCmts();drawCmt();paintCmBadge(cmUser);
  }catch(e){alert('전송 실패\n'+(e.message||e))}
}
async function delCmt(id){
  if(!confirm('코멘트를 삭제할까요?'))return;
  await fetch(BASE+'/rest/v1/'+TBL_CM+'?id=eq.'+id,{method:'DELETE',headers:HDR});
  await loadCmts();drawCmt();if(cmUser)paintCmBadge(cmUser);
}

/* ================= 업무현황 조회 ================= */
async function loadAll(){
  const r = await fetch(BASE+'/rest/v1/'+TBL_WS
    +'?select=user_id,user_name,status,content,progress,note,updated_by,updated_at'
    +'&work_date=eq.'+curDate, {headers:HDR});
  if(!r.ok) throw new Error('현황 조회 실패');
  const list = await r.json();
  rows = {};
  lastSync = null;
  list.forEach(x=>{
    rows[x.user_id] = x;
    if(!lastSync || x.updated_at > lastSync) lastSync = x.updated_at;
  });
  await loadCmts();
}

/* 증분 폴링: 변경분만 조회 (변경 없으면 빈 배열 = 최소 부하) */
async function poll(){
  if(!liveOn || document.hidden) return;
  try{
    let q = BASE+'/rest/v1/'+TBL_WS
      +'?select=user_id,user_name,status,content,progress,note,updated_by,updated_at'
      +'&work_date=eq.'+curDate;
    if(lastSync) q += '&updated_at=gt.'+encodeURIComponent(lastSync);
    const r = await fetch(q, {headers:HDR});
    if(!r.ok) return;
    const list = await r.json();
    list.forEach(x=>{
      rows[x.user_id] = x;
      if(!lastSync || x.updated_at > lastSync) lastSync = x.updated_at;
      const u = users.find(y=>y.id===x.user_id);
      if(u && els[u.id]) paintCard(els[u.id], u);
    });
    if(list.length){ renderStat(); }
    await loadCmts(); paintAllCm();
    if(cmUser) drawCmt();
    setLive(true, list.length);
  }catch(e){ setLive(false); }
}

function setLive(ok, n){
  const dot = document.getElementById('liveDot');
  const txt = document.getElementById('liveTxt');
  if(!liveOn){ dot.classList.add('off'); txt.textContent = '자동 동기화 중지됨'; return; }
  dot.classList.toggle('off', !ok);
  const t = new Date();
  txt.textContent = (ok ? '동기화 ' : '연결 오류 ')
    + String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')
    + (n ? ' · '+n+'건 갱신' : '');
}

function startTimer(){
  clearInterval(timer);
  if(liveOn) timer = setInterval(poll, POLL_MS);
}

/* ================= 렌더 ================= */
function visibleUsers(){
  return users.filter(u=>{
    if(fQry && (u.name||'').toLowerCase().indexOf(fQry) < 0) return false;
    if(fFilled && !(rows[u.id] && (rows[u.id].content||'').trim())) return false;
    return true;
  });
}

function paintCard(el, u){
  const r = rows[u.id] || null;
  const st = r && r.status ? r.status : '';
  const ct = r && r.content ? r.content : '';
  const pg = r && r.progress ? r.progress : 0;

  el.classList.toggle('filled', !!ct.trim());
  el.querySelector('.bar').style.background = st ? scolor(st) : 'var(--line)';

  const b = el.querySelector('.st');
  b.textContent = st || '미입력';
  b.style.color = st ? scolor(st) : 'var(--gray)';
  b.style.background = st ? scolor(st)+'22' : 'rgba(58,65,82,.3)';
  b.style.border = '1px solid ' + (st ? scolor(st)+'55' : 'var(--line2)');

  const c = el.querySelector('.ct');
  c.textContent = ct.trim() ? ct : '내용 없음 — 탭하여 입력';
  c.classList.toggle('empty', !ct.trim());

  el.querySelector('.pg > i').style.width = pg+'%';
  el.querySelector('.upd').textContent =
    r && r.updated_at ? (hhmm(r.updated_at) + (r.updated_by ? ' · '+r.updated_by : '')) : '';
  const nt = el.querySelector('.note');
  nt.textContent = r && r.note ? '📌 '+r.note : '';
}

function makeCard(u){
  const el = document.createElement('div');
  el.className = 'card';

  const bar = document.createElement('div'); bar.className = 'bar';
  const body = document.createElement('div'); body.className = 'body';

  const top = document.createElement('div'); top.className = 'top';
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = u.name;
  const st = document.createElement('span'); st.className = 'st';
  top.appendChild(nm); top.appendChild(st);

  const ct = document.createElement('div'); ct.className = 'ct';

  const ft = document.createElement('div'); ft.className = 'ft';
  const pg = document.createElement('div'); pg.className = 'pg';
  const pgi = document.createElement('i'); pg.appendChild(pgi);
  const upd = document.createElement('span'); upd.className = 'upd';
  const note = document.createElement('span'); note.className = 'note';
  ft.appendChild(pg); ft.appendChild(upd); ft.appendChild(note);

  body.appendChild(top); body.appendChild(ct); body.appendChild(ft);

  const hd = document.createElement('div'); hd.className = 'hd'; hd.textContent = '⋮⋮';

  const mv = document.createElement('div'); mv.className = 'mv';
  const up = document.createElement('button'); up.textContent = '▲';
  const dn = document.createElement('button'); dn.textContent = '▼';
  up.addEventListener('click', e=>{ e.stopPropagation(); moveUser(u,-1); });
  dn.addEventListener('click', e=>{ e.stopPropagation(); moveUser(u, 1); });
  mv.appendChild(up); mv.appendChild(dn);

  const cmb=document.createElement('div');cmb.className='cmbtn';
  const cb=document.createElement('button');cb.textContent='💬';
  cb.addEventListener('click',e=>{e.stopPropagation();openCmt(u)});
  const rx=document.createElement('span');rx.className='rx';
  cmb.appendChild(cb);cmb.appendChild(rx);

  el.appendChild(hd); el.appendChild(bar); el.appendChild(body); el.appendChild(cmb); el.appendChild(mv);

  if(orderMode){
    el.classList.add('ord');
    el.draggable = true;
    el.addEventListener('dragstart', ()=>{ dragId = u.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',   ()=>{ el.classList.remove('dragging'); });
    el.addEventListener('dragover',  e=>{ e.preventDefault(); });
    el.addEventListener('drop',      e=>{ e.preventDefault(); dropOn(u.id); });
  }else{
    el.addEventListener('click', ()=>openEditor(u));
  }

  paintCard(el, u);
  return el;
}

function render(){
  const list = document.getElementById('list');
  list.textContent = '';
  els = {};
  const vs = visibleUsers();
  if(!vs.length){
    const e = document.createElement('div');
    e.className = 'empty-msg'; e.textContent = '표시할 인원이 없습니다';
    list.appendChild(e); renderStat(); return;
  }
  vs.forEach(u=>{
    const el = makeCard(u);
    els[u.id] = el;
    list.appendChild(el);
    paintCmBadge(u);
  });
  renderStat();
}

function renderStat(){
  const box = document.getElementById('stat');
  box.textContent = '';
  const vs = visibleUsers();
  const tot = vs.length;
  const done = vs.filter(u=>rows[u.id] && (rows[u.id].content||'').trim()).length;

  const b0 = document.createElement('span'); b0.className = 'sbadge';
  b0.textContent = '전체 '+tot+'명';
  b0.style.color = 'var(--ink)';
  box.appendChild(b0);

  const b1 = document.createElement('span'); b1.className = 'sbadge';
  b1.textContent = '작성 '+done+' / 미작성 '+(tot-done);
  b1.style.color = done===tot && tot>0 ? 'var(--green)' : 'var(--gold)';
  box.appendChild(b1);

  STATUS.forEach(s=>{
    const n = vs.filter(u=>rows[u.id] && rows[u.id].status===s.k).length;
    if(!n) return;
    const b = document.createElement('span'); b.className = 'sbadge';
    b.textContent = s.k+' '+n; b.style.color = s.c; b.style.borderColor = s.c+'55';
    box.appendChild(b);
  });
}

/* ================= 편집 ================= */
function openEditor(u){
  if(!USER) return;
  const isSelf = USER === u.name;
  if(!isSelf && USER !== '관리자'){
    if(!confirm(u.name+' 님의 업무현황을 대신 입력/수정합니다.\n계속할까요?')) return;
  }
  editUser = u;
  const r = rows[u.id] || {};
  document.getElementById('shName').textContent = u.name;
  document.getElementById('shMeta').textContent = curDate;
  document.getElementById('shContent').value = r.content || '';
  document.getElementById('shNote').value = r.note || '';
  edStatus = r.status || '근무';
  edProg = r.progress || 0;
  buildStatusChips(); buildProgChips();
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeEditor(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  editUser = null;
}
function buildStatusChips(){
  const box = document.getElementById('shStatus'); box.textContent = '';
  STATUS.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'chip' + (edStatus===s.k ? ' on' : '');
    b.textContent = s.k;
    if(edStatus===s.k){ b.style.color = s.c; b.style.borderColor = s.c; b.style.background = s.c+'22'; }
    b.addEventListener('click', ()=>{ edStatus = s.k; buildStatusChips(); });
    box.appendChild(b);
  });
}
function buildProgChips(){
  const box = document.getElementById('shProg'); box.textContent = '';
  PROGS.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'chip' + (edProg===p ? ' on' : '');
    b.textContent = p+'%';
    b.addEventListener('click', ()=>{ edProg = p; buildProgChips(); });
    box.appendChild(b);
  });
}

async function saveEditor(){
  if(!editUser) return;
  const u = editUser;
  const payload = {
    work_date: curDate,
    user_id: u.id,
    user_name: u.name,
    status: edStatus,
    content: document.getElementById('shContent').value.trim(),
    progress: edProg,
    note: document.getElementById('shNote').value.trim(),
    updated_by: USER || ''
  };
  const btn = document.getElementById('shSave');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    const r = await fetch(BASE+'/rest/v1/'+TBL_WS+'?on_conflict=work_date,user_id', {
      method:'POST',
      headers: Object.assign({'Prefer':'resolution=merge-duplicates,return=representation'}, HDRJ),
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error(await r.text());
    const back = await r.json();
    const row = Array.isArray(back) ? back[0] : back;
    rows[u.id] = row || payload;
    if(row && row.updated_at && (!lastSync || row.updated_at > lastSync)) lastSync = row.updated_at;
    if(els[u.id]) paintCard(els[u.id], u);
    renderStat();
    closeEditor();
    toast('✓ 저장되었습니다');
  }catch(e){
    alert('저장 실패\n'+(e.message||e));
  }finally{
    btn.disabled = false; btn.textContent = '저장';
  }
}

/* ================= CSV ================= */
function exportCsv(){
  const vs = visibleUsers();
  const head = ['일자','이름','상태','업무내용','진행률','비고','최종수정','수정자'];
  const lines = [head.join(',')];
  vs.forEach(u=>{
    const r = rows[u.id] || {};
    const c = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    lines.push([curDate,u.name,r.status||'',r.content||'',(r.progress||0)+'%',
      r.note||'',r.updated_at?hhmm(r.updated_at):'',r.updated_by||''].map(c).join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '업무현황_'+curDate+'.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

async function setDate(d){
  curDate = d;
  document.getElementById('dt').value = d;
  liveOn = (d === todayStr()) && liveOn;
  document.getElementById('btnLive').textContent = liveOn ? '🔄 자동 ON' : '⏸ 자동 OFF';
  try{
    await loadAll();
    render();
    setLive(true);
  }catch(e){
    toast('조회 실패: '+e.message);
  }
  startTimer();
}
function shiftDate(n){
  const d = new Date(curDate+'T00:00:00');
  d.setDate(d.getDate()+n);
  setDate(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
}

/* ================= PC 화면 폭 조절 (📐) ================= */
const PCW_KEY='hcws_pc_width_v1';
const PCW_MIN=720, PCW_MAX=1400, PCW_STEP=20, PCW_DEF=1020;
let PCW = PCW_DEF;

function pcwClamp(v){
  let n = Number(v) || PCW_DEF;
  n = Math.round(n/PCW_STEP)*PCW_STEP;
  return Math.max(PCW_MIN, Math.min(PCW_MAX, n));
}
function loadPCWidth(){
  let v = PCW_DEF;
  try{ const x = localStorage.getItem(PCW_KEY); if(x) v = Number(x)||PCW_DEF; }catch(e){}
  applyPCWidth(v, false);
}
function applyPCWidth(w, save){
  const px = pcwClamp(w);
  PCW = px;
  document.documentElement.style.setProperty('--pcw', px+'px');
  const rg = document.getElementById('pcwRange'); if(rg) rg.value = px;
  const val = document.getElementById('pcwValue'); if(val) val.textContent = px+'px';
  if(save){
    try{ localStorage.setItem(PCW_KEY, String(px)); }catch(e){}
    pcwSaved('저장됨');
  }
  return px;
}
function previewPCWidth(v){ pcwSaved('조절중'); applyPCWidth(v, false); }
function savePCWidth(v){ applyPCWidth(v, true); }
function resetPCWidth(){
  try{ localStorage.removeItem(PCW_KEY); }catch(e){}
  applyPCWidth(PCW_DEF, false);
  pcwSaved('기본값');
}
function pcwSaved(t){
  const el = document.getElementById('pcwSaved'); if(!el) return;
  el.textContent = t;
  clearTimeout(pcwSaved._t);
  if(t==='기본값') pcwSaved._t = setTimeout(()=>el.textContent='저장됨', 900);
}
function togglePCWidthPopup(e){
  if(e) e.stopPropagation();
  if(window.matchMedia('(max-width:760px)').matches) return;
  const pop = document.getElementById('pcWidthPopup'), btn = document.getElementById('pcWidthBtn');
  if(!pop || !btn) return;
  const open = !pop.classList.contains('show');
  pop.classList.toggle('show', open);
  btn.classList.toggle('on', open);
  btn.setAttribute('aria-expanded', open?'true':'false');
  if(open){ const rg=document.getElementById('pcwRange'); if(rg) rg.focus({preventScroll:true}); }
}
function closePCWidthPopup(){
  const pop = document.getElementById('pcWidthPopup'), btn = document.getElementById('pcWidthBtn');
  if(pop) pop.classList.remove('show');
  if(btn){ btn.classList.remove('on'); btn.setAttribute('aria-expanded','false'); }
}
document.addEventListener('click', e=>{
  const menu = document.getElementById('pcWidthMenu');
  if(menu && !menu.contains(e.target)) closePCWidthPopup();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closePCWidthPopup(); if(MENU_EDIT) setMenuEdit(false); } });

/* ================= 상단 도구 메뉴 위치(순서) 편집 (☷) ================= */
const MENUORD_KEY = 'hcws_menu_order_v1';
const MENU_LONGPRESS_MS = 500;
let MENU_DEFAULT_ORDER = [];
let MENU_EDIT = false, MENU_PRESS = null, MENU_DRAG = null, MENU_BLOCK_CLICK_UNTIL = 0;

function menuBox(){ return document.getElementById('toolChips'); }
function menuItems(){
  const b = menuBox();
  return b ? [...b.children].filter(el=>el.matches('[data-menu-id]')) : [];
}
function menuOrderNow(){ return menuItems().map(el=>el.dataset.menuId); }
function applyMenuOrder(order){
  const b = menuBox(); if(!b) return;
  const items = menuItems(), byId = new Map(items.map(el=>[el.dataset.menuId, el]));
  const used = new Set();
  (Array.isArray(order)?order:[]).forEach(id=>{
    const el = byId.get(id);
    if(el && !used.has(id)){ b.appendChild(el); used.add(id); }
  });
  items.forEach(el=>{ if(!used.has(el.dataset.menuId)) b.appendChild(el); });
}
function saveMenuOrder(){
  try{ localStorage.setItem(MENUORD_KEY, JSON.stringify(menuOrderNow())); }catch(e){}
}
function loadMenuOrder(){
  let saved = [];
  try{ saved = JSON.parse(localStorage.getItem(MENUORD_KEY)||'[]'); }catch(e){ saved = []; }
  if(Array.isArray(saved) && saved.length) applyMenuOrder(saved);
}
function initMenuOrder(){
  const b = menuBox(); if(!b) return;
  MENU_DEFAULT_ORDER = menuOrderNow();
  loadMenuOrder();
  b.addEventListener('pointerdown', menuPointerDown, {passive:true});
  b.addEventListener('click', e=>{
    if(!e.target.closest('[data-menu-id]')) return;
    if(MENU_EDIT || Date.now() < MENU_BLOCK_CLICK_UNTIL){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    }
  }, true);
  document.addEventListener('pointermove', menuPointerMove, {passive:false});
  document.addEventListener('pointerup', menuPointerUp, {passive:false});
  document.addEventListener('pointercancel', menuPointerUp, {passive:false});
}
function toggleMenuEdit(e){ if(e){ e.preventDefault(); e.stopPropagation(); } setMenuEdit(!MENU_EDIT); }
function setMenuEdit(on){
  MENU_EDIT = !!on;
  document.body.classList.toggle('menu-editing', MENU_EDIT);
  const btn = document.getElementById('menuOrderBtn');
  if(btn){
    btn.classList.toggle('on', MENU_EDIT);
    btn.setAttribute('aria-pressed', MENU_EDIT?'true':'false');
    btn.title = MENU_EDIT ? '메뉴 위치 편집 완료' : '상단 도구 메뉴 위치 편집';
  }
  cancelMenuPress();
  if(!MENU_EDIT) finishMenuDrag(false);
  if(MENU_EDIT){
    const p = document.getElementById('fpanel');
    if(p){ p.open = true; setTimeout(()=>document.getElementById('menuEditNote')?.scrollIntoView({block:'nearest'}), 30); }
  }
}
function completeMenuEdit(e){ if(e){ e.preventDefault(); e.stopPropagation(); } setMenuEdit(false); }
function resetMenuOrder(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(!confirm('상단 도구 메뉴 위치를 기본값으로 되돌릴까요?')) return;
  try{ localStorage.removeItem(MENUORD_KEY); }catch(err){}
  applyMenuOrder(MENU_DEFAULT_ORDER);
  toast('메뉴 위치를 기본값으로 복원했습니다');
}
function cancelMenuPress(){
  if(MENU_PRESS?.timer) clearTimeout(MENU_PRESS.timer);
  MENU_PRESS = null;
}
function menuPointerDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const item = e.target.closest('[data-menu-id]');
  if(!item || item.parentElement !== menuBox()) return;
  MENU_PRESS = {item, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, timer:null};
  if(MENU_EDIT){ beginMenuDrag(item, e.pointerId); return; }
  MENU_PRESS.timer = setTimeout(()=>{
    if(!MENU_PRESS || MENU_PRESS.pointerId !== e.pointerId) return;
    setMenuEdit(true);
    MENU_BLOCK_CLICK_UNTIL = Date.now() + 700;
    try{ navigator.vibrate?.(24); }catch(err){}
    beginMenuDrag(item, e.pointerId);
  }, MENU_LONGPRESS_MS);
}
function beginMenuDrag(item, pointerId){
  if(!item) return;
  if(MENU_PRESS?.timer){ clearTimeout(MENU_PRESS.timer); MENU_PRESS.timer = null; }
  MENU_DRAG = {item, pointerId};
  item.classList.add('menu-dragging');
  try{ item.setPointerCapture?.(pointerId); }catch(e){}
}
function reorderMenuDragAt(x, y){
  if(!MENU_DRAG) return;
  const item = MENU_DRAG.item, b = menuBox(); if(!b) return;
  const others = menuItems().filter(el=>el !== item);
  others.forEach(el=>el.classList.remove('menu-drop-before'));
  let before = null;
  for(const el of others){
    const r = el.getBoundingClientRect();
    if(y < r.bottom && (y < r.top || x < r.left + r.width/2)){ before = el; break; }
  }
  if(before){ before.classList.add('menu-drop-before'); b.insertBefore(item, before); }
  else b.appendChild(item);
}
function menuPointerMove(e){
  if(MENU_PRESS && MENU_PRESS.pointerId === e.pointerId && !MENU_DRAG){
    if(Math.hypot(e.clientX-MENU_PRESS.startX, e.clientY-MENU_PRESS.startY) > 10) cancelMenuPress();
    return;
  }
  if(!MENU_DRAG || MENU_DRAG.pointerId !== e.pointerId) return;
  e.preventDefault();
  MENU_BLOCK_CLICK_UNTIL = Date.now() + 500;
  reorderMenuDragAt(e.clientX, e.clientY);
}
function finishMenuDrag(save=true){
  if(!MENU_DRAG) return;
  const item = MENU_DRAG.item;
  try{ item.releasePointerCapture?.(MENU_DRAG.pointerId); }catch(e){}
  item.classList.remove('menu-dragging');
  menuItems().forEach(el=>el.classList.remove('menu-drop-before'));
  MENU_DRAG = null;
  if(save){ saveMenuOrder(); toast('메뉴 위치가 저장되었습니다'); }
}
function menuPointerUp(e){
  if(MENU_DRAG && MENU_DRAG.pointerId === e.pointerId){
    e.preventDefault(); MENU_BLOCK_CLICK_UNTIL = Date.now() + 650;
    finishMenuDrag(true); MENU_PRESS = null; return;
  }
  if(MENU_PRESS && MENU_PRESS.pointerId === e.pointerId) cancelMenuPress();
}

  if(!USER){
    alert('로그인이 필요합니다.');
    location.href = 'index.html';
    return;
  }
  document.getElementById('meLabel').textContent = USER;

  loadPCWidth();
  initMenuOrder();

  document.getElementById('btnBack').addEventListener('click', ()=>{ location.href='index.html'; });
  document.getElementById('btnPrev').addEventListener('click', ()=>shiftDate(-1));
  document.getElementById('btnNext').addEventListener('click', ()=>shiftDate(1));
  document.getElementById('btnToday').addEventListener('click', ()=>setDate(todayStr()));
  document.getElementById('dt').addEventListener('change', e=>setDate(e.target.value));

  document.getElementById('btnSync').addEventListener('click', async ()=>{
    const b = document.getElementById('btnSync');
    b.textContent = '⟳ ...';

    liveOn = keep;
    b.textContent = '⟳ 새로고침';

  });

    liveOn = !liveOn;

  });

  document.getElementById('shSave').addEventListener('click', saveEditor);

  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
  window.addEventListener('focus', poll);

  try{ await loadUsers(false); }
  catch(e){ alert('인원 조회 실패: '+e.message); return; }
  await setDate(todayStr());
}
init();
