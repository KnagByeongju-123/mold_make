<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>자재발주 관리 — 금형제작관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

/* ============ HC_Smart T3 다크 골드 테마 ============ */
:root{
  --bg:#0f1117; --card:#1a1d27; --card2:#161925;
  --ink:#e8eaf0; --sub:#aab0c4; --gray:#8a92a8;
  --gold:#e2b04a; --gold2:#f6d365; --gold3:#fda085;
  --goldbg:rgba(226,176,74,.12); --goldbd:rgba(226,176,74,.4);
  --navy:#1a1d27; --navy2:#222635;
  --yellow:#e2b04a; --yellowbg:rgba(226,176,74,.1);
  --blue:#4f8cff; --red:#ff7b7b; --green:#7ee0a0;
  --cust:#b48be8; --self:#4f8cff; --out:#f0a04b;
  --mm-fs:1;
  /* 테두리 진하기(3단계) — 저해상도 모니터 가독성 대응 */
  --line:#4d5872; --line2:#3a4152; --line3:#5c6884; --line4:#6d7a99;
}
html.bd-1{--line:#3a4152; --line2:#2a3040; --line3:#4a5268; --line4:#5a6580}
html.bd-2{--line:#4d5872; --line2:#3a4152; --line3:#5c6884; --line4:#6d7a99}
html.bd-3{--line:#6a7794; --line2:#4d5872; --line3:#7b89a8; --line4:#8d9bba}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow-x:hidden}
.mono{font-family:'IBM Plex Mono',monospace}

.gold-txt{background:linear-gradient(120deg,var(--gold2),var(--gold),var(--gold3),var(--gold2));
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:250% center}}

/* ============ 헤더 + 햄버거 드로어 (HC_Smart M5) ============ */
header{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#181b26,#0f1117ee);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:11px 16px}
.hmb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex-shrink:0}
.hmb i{width:16px;height:2px;border-radius:1px;background:var(--gold);display:block}
.htitle{font-size:17px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hleft{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
header .hright{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.ubadge{font-size:11px;font-weight:800;color:var(--gold);border:1px solid var(--goldbd);
  background:var(--goldbg);padding:3px 12px;border-radius:14px;cursor:pointer;white-space:nowrap}
.ubadge:hover{background:rgba(226,176,74,.2)}
.abell{position:relative;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:9px;line-height:1;animation:bellpulse 2s infinite}
.abell i{position:absolute;top:-4px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:9.5px;font-weight:900;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--bg)}
@keyframes bellpulse{0%,100%{transform:none}8%{transform:rotate(-12deg)}16%{transform:rotate(10deg)}24%{transform:rotate(-6deg)}32%{transform:none}}
header .rev{font-size:10px;color:var(--sub);border:1px solid var(--line);padding:1px 6px;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;white-space:nowrap;opacity:.7}

#dim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.3s}
#dim.on{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;left:0;bottom:0;z-index:90;width:308px;max-width:88vw;
  background:#141721;border-right:1px solid var(--line);box-shadow:6px 0 24px rgba(0,0,0,.5);
  transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;padding:22px 14px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#drawer.on{transform:none}
#drawer .dlogo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
#drawer .dlogo b{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
#drawer .dlogo .n{font-size:18.5px;font-weight:900}
#drawer .dlogo .s{font-size:13px;color:var(--sub)}
#drawer .mi{display:flex;align-items:center;gap:13px;font-size:18.5px;font-weight:700;color:var(--sub);
  padding:14px 12px;border-radius:11px;cursor:pointer;transition:.15s}
#drawer .mi .ic{font-size:21px;width:28px;text-align:center}
#drawer .mi.on{background:var(--goldbg);color:var(--gold)}
#drawer .mi:not(.on):hover{background:rgba(255,255,255,.04);color:var(--ink)}
#drawer .mgh .arw{margin-left:auto;font-size:14px;opacity:.7;transition:transform .2s}
#drawer .mg.open .mgh .arw{transform:rotate(180deg)}
#drawer .mg.open .mgh{color:var(--gold)}
#drawer .msub{display:none;margin:2px 0 4px 10px;padding-left:8px;border-left:1px dashed var(--line)}
#drawer .mg.open .msub{display:block}
#drawer .msub .mi{font-size:17px;padding:12px 10px}
#drawer .msub .mi .ic{font-size:19px;width:25px}
#drawer .foot{margin-top:auto;font-size:12.5px;color:var(--sub);opacity:.6;padding:10px 8px 4px;line-height:1.5}

/* PC 가독성: 일반 화면은 1020px까지만 유동 확대 */
/* --mm-fs : 글자 크기 배율(본문/모달 확대·축소). 고정 헤더 여백은 배율로 나눠 상쇄 */
main{width:100%;max-width:1020px;margin:0 auto;
  zoom:var(--mm-fs,1);
  padding:calc(81px / var(--mm-fs,1)) 16px calc(60px / var(--mm-fs,1))}
.hide{display:none!important}

/* 대시보드 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 6px;text-align:center}
.stat .k{font-size:11.5px;color:var(--sub);font-weight:600}
.stat .v{font-size:24px;font-weight:900;line-height:1.1}
.stat.s1 .v{color:var(--blue)}.stat.s2 .v{color:var(--green)}.stat.s3 .v{color:var(--red)}.stat.s4 .v{color:var(--gold)}

.projcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.projcard:hover{border-color:var(--goldbd)}
.projcard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.projcard .no{font-weight:700;background:var(--goldbg);border:1px solid var(--goldbd);color:var(--gold);padding:2px 9px;border-radius:6px;font-size:12px}
.projcard .nm{font-weight:700;font-size:16px}
.projcard .cs{color:var(--sub);font-size:13px}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.b-run{background:rgba(240,160,75,.16);color:var(--out)}.b-done{background:rgba(126,224,160,.14);color:var(--green)}
.b-hold{background:rgba(255,255,255,.07);color:var(--sub)}.b-ng{background:rgba(255,123,123,.14);color:var(--red)}
.b-arch{background:rgba(196,157,255,.16);color:var(--cust)}
.projcard.arch{opacity:.72;border-style:dashed}
.pfilter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pfilter button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pfilter button.on{background:var(--goldbg);border-color:var(--goldbd);color:var(--gold)}
.pcbtns{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.pcbtns button{padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--card2);color:var(--sub)}
.pcbtns button.trc{border-color:var(--goldbd);color:var(--gold);background:var(--goldbg)}
.pcbtns button.arc{border-color:rgba(196,157,255,.45);color:var(--cust);background:rgba(196,157,255,.1)}
.pcbtns button.res{border-color:rgba(240,160,75,.45);color:var(--out)}
/* 추적 타임라인 */
.tlwrap{position:relative;padding-left:18px}
.tlwrap:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tlrow{position:relative;margin-bottom:11px}
.tlrow:before{content:'';position:absolute;left:-16px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gray);border:2px solid var(--card)}
.tlrow.k-등록:before{background:var(--gold)}.tlrow.k-시작:before{background:var(--out)}
.tlrow.k-OK:before{background:var(--blue)}.tlrow.k-NG:before{background:var(--red)}
.tlrow.k-출력물:before{background:var(--gold)}.tlrow.k-부품:before{background:var(--out)}
.tlrow.k-Tryout:before{background:var(--cust)}.tlrow.k-완료:before,.tlrow.k-보관:before{background:var(--green)}
.tlrow.k-검사:before{background:var(--blue)}.tlrow.k-시정:before{background:var(--red)}.tlrow.k-변경:before{background:var(--out)}
.tlrow.k-결재:before{background:var(--gold)}
.tlhd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tlk{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:5px;background:var(--card2);border:1px solid var(--line)}
.tlt{font-size:10.5px;color:var(--gray);font-family:'IBM Plex Mono',monospace}
.tlw{font-size:10.5px;color:var(--sub)}
.tld{font-size:13px;margin-top:3px;line-height:1.5}
.tlsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tlsum span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.pbar{height:8px;background:var(--line2);border-radius:5px;margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:5px}
.projcard .meta{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--sub)}
.projcard .meta{flex-wrap:wrap;gap:6px}
.dd{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:5px;font-family:'IBM Plex Mono',monospace}
.dd-ok{background:rgba(79,140,255,.16);color:var(--blue)}
.dd-soon{background:rgba(240,160,75,.18);color:var(--out)}
.dd-over{background:rgba(255,123,123,.16);color:var(--red)}
.projcard .cur{color:var(--gold);font-weight:700}
.del{margin-left:auto;background:none;border:none;color:#5a6478;cursor:pointer;font-size:16px;padding:2px 6px}
.del:hover{color:var(--red)}

/* 등록 폼 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:560px}
.panel h2{font-size:16px;margin-bottom:16px;font-weight:800}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line3);border-radius:10px;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}
.fg input[type=file]{padding:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:10px 22px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-p{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#241a05}
.btn-p:hover{filter:brightness(1.06)}

/* 공정 보드 */
.psel{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.psel select{padding:10px 12px;border:1.5px solid var(--line3);border-radius:10px;font-size:14px;font-family:inherit;background:var(--card2);color:var(--ink);min-width:280px}

.op{display:grid;grid-template-columns:64px 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.op.st-대기{border-color:rgba(240,160,75,.35)}
.op.st-대기 .opcode{background:rgba(240,160,75,.1);border-right-color:rgba(240,160,75,.3)}
.op.st-대기 .opcode b{color:var(--out)}
.op.st-OK{border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.05)}
.op.st-OK .opcode{background:rgba(79,140,255,.12);border-right-color:rgba(79,140,255,.3)}
.op.st-OK .opcode b{color:var(--blue)}
.op.st-OK .nm{color:#9dbcf5}
.op.st-진행{border-color:var(--out);box-shadow:0 0 0 2px rgba(240,160,75,.18);background:rgba(240,160,75,.06)}
.op.st-진행 .opcode{background:rgba(240,160,75,.15);border-right-color:rgba(240,160,75,.35)}
.op.st-진행 .opcode b{color:var(--out)}
.op.st-NG{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,123,123,.18)}
.opcode{background:var(--goldbg);border-right:1px solid var(--goldbd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px}
.opcode b{font-size:16px;font-weight:600;color:var(--gold);letter-spacing:-.5px}
.opbody{padding:11px 14px;display:flex;gap:14px;align-items:flex-start}
.opinfo{flex:1;min-width:0}
.opinfo .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opinfo .nm{font-weight:700;font-size:15px}
.dept{font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--sub);padding:1px 8px;border-radius:5px}
.st{font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px}
.st-w{background:rgba(240,160,75,.12);color:var(--out)}
.st-r{background:rgba(240,160,75,.18);color:var(--out)}
.st-ok{background:rgba(79,140,255,.16);color:var(--blue)}
.st-ng{background:rgba(255,123,123,.16);color:var(--red)}
.ngc{font-size:11px;color:var(--red);font-weight:700}
.tasks{margin-top:6px;font-size:12.5px;color:var(--sub);line-height:1.55}
.tasks li{list-style:none;padding-left:11px;position:relative}
.tasks li::before{content:'–';position:absolute;left:0;color:#5a6478}
.outs{margin-top:5px;font-size:11.5px;color:var(--gray)}
.outs b{color:var(--sub);font-weight:700}
.opmeta{margin-top:5px;font-size:11px;color:var(--gray)}
.opacts{display:flex;flex-direction:column;gap:5px;min-width:74px}
.opacts button{padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub)}
.b-start{color:var(--out);border-color:rgba(240,160,75,.4)}
.b-start:hover{background:rgba(240,160,75,.1)}
.b-ok{color:var(--blue);border-color:rgba(79,140,255,.4)}
.b-ok:hover{background:rgba(79,140,255,.1)}
.b-ng2{color:var(--red);border-color:rgba(255,123,123,.4)}
.b-ng2:hover{background:rgba(255,123,123,.1)}
.ngline{grid-column:1/3;background:rgba(255,123,123,.08);border-top:1px dashed rgba(255,123,123,.4);color:var(--red);font-size:12px;font-weight:600;padding:6px 14px}

/* 공정 상세 모달 */
.nm.click{cursor:pointer}
.nm.click:hover{color:var(--gold);text-decoration:underline}
.ico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--line2);color:var(--sub);font-size:10px;font-weight:700;font-style:normal;vertical-align:1px}
.nm.click:hover .ico{background:var(--gold);color:#241a05}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:calc(20px / var(--mm-fs,1));zoom:var(--mm-fs,1)}
.modal.show{display:flex}
.mbox{background:var(--card);border:1.5px solid var(--line4);border-radius:16px;width:100%;max-width:480px;max-height:88%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.mno{background:var(--goldbg);border:1px solid var(--goldbd);color:var(--gold);font-size:14px;font-weight:600;padding:2px 10px;border-radius:7px}
.mtitle{font-size:16px;font-weight:800}
.mx{margin-left:auto;background:none;border:none;font-size:16px;color:var(--sub);cursor:pointer}
.mx:hover{color:var(--ink)}
.mbody{padding:16px 18px 20px}
.msec{margin-bottom:16px}
.msec:last-child{margin-bottom:0}
.msec h4{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;margin-bottom:7px}
.msec li{list-style:none;font-size:13.5px;color:var(--ink);line-height:1.75;padding-left:14px;position:relative}
.msec li::before{content:'–';position:absolute;left:0;color:#5a6478}
#m-outs li{color:var(--sub);font-size:13px}
#m-ng{font-size:13.5px;color:var(--red);font-weight:600}

/* 출력물 체크리스트 */
.outsec{grid-column:1/3;border-top:1px solid var(--line);background:rgba(226,176,74,.04)}
.otitle{padding:7px 14px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.otitle b{color:var(--gold)}
.ocomp{margin-left:8px;font-size:10.5px;font-weight:800;background:rgba(126,224,160,.14);color:var(--green);padding:1px 8px;border-radius:12px}
.outsec .obody{display:none;padding:0 14px 12px}
.outsec.open .obody{display:block}
.otbl{width:100%;min-width:460px;background:var(--card2);border:1px solid var(--line);border-radius:9px;border-collapse:separate;border-spacing:0}
.otbl td{padding:6px 10px;font-size:12.5px;border-top:1px solid var(--line2);color:var(--ink);white-space:nowrap}
.otbl tr:first-child td{border-top:none}
.olabel{display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.olabel input{width:15px;height:15px;accent-color:var(--green);flex-shrink:0}
.ometa{width:160px;font-size:11px;color:var(--green);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.oev{width:66px;text-align:right}
.oev img{display:inline-block;width:34px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:pointer}
.oatt{display:inline-block;font-size:11px;color:var(--sub);border:1px dashed var(--line4);padding:3px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.4}
.oatt:hover{color:var(--gold);border-color:var(--gold)}
.pdate{padding:5px 7px;border:1.5px solid var(--line3);border-radius:7px;font-size:12px;font-family:inherit;background:var(--card2);color:var(--ink)}
tr.late td{background:rgba(255,123,123,.07)}
tr.undone td{background:rgba(255,123,123,.05)}
.devi{width:34px;height:28px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer}

/* 외주 부품 */
.partsec{grid-column:1/3;border-top:1px solid var(--line);background:rgba(79,140,255,.04)}
.ptitle{padding:7px 14px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.ptitle b{color:var(--out)}
.psum{margin-left:8px;font-weight:500;color:var(--gray);font-size:11px}
.partsec .pbody{display:none;padding:0 14px 12px}
.partsec.open .pbody{display:block}
.partsec.open .ptitle{color:var(--ink)}
.ptbl{width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card2);border-collapse:separate;border-spacing:0}

.ptbl .wk{color:var(--sub);min-width:150px}
.dstamp{padding:2px 9px;font-size:11px;border:1px dashed var(--line4);background:var(--card2);border-radius:6px;color:var(--sub);cursor:pointer;font-family:inherit}
.dstamp:hover{border-color:var(--out);color:var(--out)}
.dset{font-size:11.5px;font-weight:700;color:var(--green);font-family:'IBM Plex Mono',monospace}
.pdel{background:none;border:none;color:#5a6478;cursor:pointer;font-size:13px}
.pdel:hover{color:var(--red)}
.pempty{text-align:center;color:var(--gray);font-size:11.5px}
.paddwrap{margin-top:8px}
.paddtoggle{width:100%;padding:9px 0;border:1.5px dashed var(--line3);border-radius:9px;background:transparent;color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.paddtoggle span{color:var(--gold);font-weight:900;font-size:14px}
.paddtoggle:hover{border-color:var(--goldbd);color:var(--gold)}
.paddwrap.open .paddtoggle{display:none}
.padd{display:none;flex-direction:column;gap:9px;padding:13px;border:1.5px solid var(--goldbd);border-radius:11px;background:var(--card2)}
.paddwrap.open .padd{display:flex}
.pf{display:flex;flex-direction:column;gap:4px}
.pf label{font-size:11px;font-weight:700;color:var(--gray)}
.pf input{width:100%;padding:9px 11px;border:1.5px solid var(--line3);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
.pf input:focus{outline:none;border-color:var(--gold)}
.pbtns{display:flex;gap:7px;margin-top:2px}
.pcancel{flex:1;padding:10px 0;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.psave{flex:2;padding:10px 0;border:none;border-radius:9px;background:linear-gradient(160deg,var(--gold2),var(--gold));color:#241a05;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}

/* 이력 */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
.tscroll table{border:none}
.tscroll::-webkit-scrollbar{height:6px}
.tscroll::-webkit-scrollbar-thumb{background:var(--line3);border-radius:3px}
table.wide{min-width:720px}
table.wide th,table.wide td{white-space:nowrap}
table.wide td.wrap{white-space:normal;min-width:220px}
.ptbl{min-width:660px}
.ptbl th,.ptbl td{white-space:nowrap}
th,td{padding:9px 12px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line2)}
th{background:var(--navy2);color:var(--gold);font-size:12px;font-weight:700}
tr:last-child td{border-bottom:none}
.a-OK{color:var(--green);font-weight:700}.a-NG{color:var(--red);font-weight:700}
.a-시작{color:var(--blue);font-weight:700}.a-부품{color:var(--out);font-weight:700}.a-Tryout{color:var(--cust);font-weight:700}.a-출력물{color:var(--gold);font-weight:700}.a-계획{color:var(--green);font-weight:700}

/* 이력 필터 */
.hfilter{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.hfilter input[type=date],.hfilter select{padding:8px 10px;border:1.5px solid var(--line3);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card2);color:var(--ink)}
.hfilter .tilde{color:var(--sub)}
.hfilter .hbtn2,.hfilter .hbtn{padding:8px 18px;width:auto;height:auto;border-radius:8px;display:inline-block}
.hfilter .hclr{padding:8px 14px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.hfilter .hxls{padding:8px 16px;background:rgba(126,224,160,.16);border:1px solid rgba(126,224,160,.4);color:var(--green);margin-left:auto}
.hfilter .hpdf{padding:8px 16px;background:rgba(255,123,123,.14);border:1px solid rgba(255,123,123,.4);color:var(--red)}
.hfilter .hxls+.hpdf{margin-left:0}
.psel .hxls{background:rgba(126,224,160,.16)!important;border:1px solid rgba(126,224,160,.4);color:var(--green)!important}
.psel .hpdf{background:rgba(255,123,123,.14)!important;border:1px solid rgba(255,123,123,.4);color:var(--red)!important}

/* 게시판 */
.bcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:8px}
.bcard.bdone{opacity:.55}
.btop{display:flex;align-items:center;gap:10px}
.bst{font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px;background:var(--goldbg);color:var(--gold);cursor:pointer;user-select:none}
.bst.ok{background:rgba(126,224,160,.14);color:var(--green)}
.bst:hover{outline:2px solid var(--line)}
.btt{font-size:14px}
.bmeta{margin-left:auto;font-size:11.5px;color:var(--sub)}
.bct{margin-top:7px;font-size:13px;color:var(--sub);line-height:1.65;white-space:pre-wrap}

/* Tryout */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 16px;border:1.5px solid var(--line3);border-radius:20px;background:var(--card2);font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
.chips button.on{background:var(--goldbg);border-color:var(--gold);color:var(--gold)}
.chips.st2 button.on{background:rgba(79,140,255,.14);border-color:var(--blue);color:var(--blue)}
.tplist{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tp{position:relative}
.tp img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.tp button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--red);color:#241a05;font-size:10px;cursor:pointer;font-weight:900}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:8px}
.ttop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tdate{font-size:12px;font-weight:600;color:var(--gold);background:var(--goldbg);border:1px solid var(--goldbd);padding:1px 8px;border-radius:6px}
.tstage{font-size:11px;font-weight:700;background:rgba(180,139,232,.14);color:var(--cust);padding:2px 9px;border-radius:20px}
.tst{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--sub)}
.tst.ok{background:rgba(126,224,160,.14);color:var(--green)}
.tst.run{background:rgba(79,140,255,.14);color:var(--blue)}
.tst.issue{background:rgba(255,123,123,.14);color:var(--red)}
.trow{margin-top:6px;font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap}
.trow b{display:inline-block;font-size:10.5px;color:var(--sub);background:rgba(255,255,255,.07);padding:1px 7px;border-radius:4px;margin-right:7px;vertical-align:1px}
.trow.iss b{background:rgba(255,123,123,.14);color:var(--red)}
.tphotos{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.tedit{background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.4);color:var(--blue);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;cursor:pointer;font-family:inherit}
.tedit:hover{background:rgba(79,140,255,.2)}
.tphotos img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}

/* 사용안내 */
.hp{color:var(--sub);font-size:13.5px;line-height:1.7;margin-bottom:18px;padding:12px 16px;background:var(--goldbg);border:1px solid var(--goldbd);border-radius:11px}
.hp b{color:var(--gold)}
.hstep{display:grid;grid-template-columns:56px 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.hn{background:linear-gradient(160deg,rgba(226,176,74,.2),rgba(226,176,74,.06));color:var(--gold);font-size:15px;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding-top:18px;border-right:1px solid var(--line)}
.hb{padding:16px 20px}
.hb h3{font-size:15px;margin-bottom:6px;font-weight:800}
.hb p{font-size:13px;color:var(--sub);line-height:1.65}
.hb ul{margin-top:8px}
.hb li{list-style:none;font-size:12.8px;color:var(--sub);line-height:1.7;padding-left:13px;position:relative}
.hb li::before{content:'–';position:absolute;left:0;color:#5a6478}
.hb b{color:var(--gold)}
.htbl{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.htbl td{padding:8px 12px;font-size:12.8px;border-bottom:1px solid var(--line2);background:var(--card2);color:var(--sub)}
.htbl td:first-child{width:150px;font-weight:700;color:var(--gold)}
.htbl.ng td:first-child{color:var(--red)}
.htbl tr:last-child td{border-bottom:none}
.htbl button{width:74px}
.uin{width:100%;padding:6px 9px;border:1.5px solid var(--line3);border-radius:7px;font-size:12.5px;font-family:inherit;background:var(--card2);color:var(--ink)}
.ubtn{background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--sub);font-size:11.5px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit}
.ubtn:hover{border-color:var(--gold);color:var(--gold)}
.ubtn.save{background:linear-gradient(160deg,var(--gold2),var(--gold));border-color:var(--gold);color:#241a05}
.hnote{margin-top:10px;font-size:12.5px;color:var(--gray)}
.dotin{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.dotin.cust{background:var(--cust);border-radius:50%}
.dotin.self{background:var(--self)}
.dotin.out{background:var(--out);border-radius:50%}
.hnotebox{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 18px;margin-top:16px}
.hnotebox b{font-size:13px;color:var(--gold)}
.hnotebox li{list-style:none;font-size:12.5px;color:var(--sub);line-height:1.75;padding-left:13px;position:relative;margin-top:4px}
.hnotebox li::before{content:'·';position:absolute;left:2px;color:#5a6478;font-weight:900}
h1.pt em{font-size:13px;font-weight:500;color:var(--sub)}

/* PIN 로그인 (HC_Smart 스타일) */
#login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
#login::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(226,176,74,.16),transparent 55%)}
.lgbox{text-align:center;width:100%;max-width:320px;position:relative;z-index:1}
.lglogo{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;
  box-shadow:0 0 30px rgba(226,176,74,.35)}
.lgtitle{font-size:30px;font-weight:900;color:var(--ink);letter-spacing:-.5px}
.lgtitle em{font-style:normal;background:linear-gradient(120deg,var(--gold2),var(--gold),var(--gold3),var(--gold2));
  background-size:250% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
.lgsub{font-size:12px;color:var(--sub);margin-top:4px;letter-spacing:2px}
.pinview{display:flex;gap:14px;justify-content:center;margin:30px 0 12px}
.pinview i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line3);transition:.12s}
.pinview i.f{background:var(--gold);border-color:var(--gold)}
.pinview.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lgmsg{font-size:12.5px;color:var(--sub);min-height:18px;margin-bottom:18px}
.lgmsg.err{color:var(--red)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{padding:16px 0;font-size:20px;font-weight:700;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:.1s}
.pinpad button:active{background:var(--gold);border-color:var(--gold);color:#241a05}
.pinpad .pfn{color:var(--sub);font-size:16px}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#252a3a;border:1px solid var(--goldbd);color:var(--ink);padding:11px 22px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--gray);padding:50px 0;font-size:14px}
h1.pt{font-size:19px;font-weight:900;margin-bottom:14px;letter-spacing:-.4px}
h1.pt em{font-style:normal;color:var(--gold)}
section{animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 공정설계 */
.opcard{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.opord{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.opord button{width:26px;height:21px;border:1px solid var(--line);border-radius:5px;background:var(--card2);color:var(--sub);font-size:9px;cursor:pointer;line-height:1;padding:0}
.opord button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.opord button:disabled{opacity:.25;cursor:default}
.opinf{flex:1;min-width:0}
.opt{font-size:14px;font-weight:700}
.opt b{color:var(--gold);margin-right:5px}
.opsub{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px}
.atag{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:5px}
.atag.a-c{background:rgba(196,157,255,.16);color:var(--cust)}
.atag.a-s{background:rgba(79,140,255,.16);color:var(--blue)}
.atag.a-o{background:rgba(240,160,75,.16);color:var(--out)}
.ocnt{font-size:10.5px;color:var(--gray)}
.ocnt.clk{cursor:pointer;border:1px solid var(--goldbd);color:var(--gold);padding:1px 8px;border-radius:5px;font-weight:700}
.ocnt.clk:hover{background:var(--goldbg)}
.opwrap{margin-bottom:8px}
.opwrap .opcard{margin-bottom:0}
.oppanel{background:var(--card2);border:1px solid var(--goldbd);border-top:0;border-radius:0 0 12px 12px;padding:10px 13px 12px;margin:-1px 0 0}
.oppanel .oph{font-size:11.5px;font-weight:700;color:var(--gold);margin-bottom:8px}
.orow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px}
.orow .on{flex:1;min-width:0;font-size:13px;font-weight:600;word-break:break-all}
.orow .oi{width:20px;text-align:center;font-size:10.5px;color:var(--gray);font-family:'IBM Plex Mono',monospace;flex-shrink:0}
.orow button{border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--sub);font-size:10.5px;cursor:pointer;padding:4px 7px;flex-shrink:0;line-height:1.2}
.orow button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.orow button:disabled{opacity:.25;cursor:default}
.orow button.dl:hover{border-color:var(--red);color:var(--red)}
.oadd{display:flex;gap:6px;margin-top:8px}
.oadd input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:13px;font-family:inherit}
.oadd input:focus{outline:none;border-color:var(--gold)}
.oadd button{flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--goldbd);background:var(--goldbg);color:var(--gold);font-size:12.5px;font-weight:700;cursor:pointer}
.oempty{font-size:12px;color:var(--gray);padding:6px 2px}

/* 품질관리 */
.qacard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
.qacard.open-ncr{border-color:rgba(255,123,123,.5)}
.qahd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qahd .no2{font-weight:700;background:var(--goldbg);border:1px solid var(--goldbd);color:var(--gold);padding:1px 8px;border-radius:6px;font-size:11.5px}
.qahd .kd{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:5px;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.qahd .stbt{margin-left:auto;font-size:11px;font-weight:800;padding:3px 11px;border-radius:20px;cursor:pointer;border:1px solid}
.stbt.opened{background:rgba(255,123,123,.14);border-color:rgba(255,123,123,.45);color:var(--red)}
.stbt.closed{background:rgba(126,224,160,.14);border-color:rgba(126,224,160,.45);color:var(--green)}
.stbt.review{background:rgba(240,160,75,.14);border-color:rgba(240,160,75,.45);color:var(--out)}
.qabody{margin-top:9px;font-size:13px;line-height:1.6}
.qabody b{color:var(--gold);font-size:11.5px;display:block;margin-top:7px}
.qabody b:first-child{margin-top:0}
.qaft{margin-top:9px;font-size:11px;color:var(--gray);display:flex;gap:10px;flex-wrap:wrap}
.jd-ok{color:var(--blue);font-weight:800}.jd-ng{color:var(--red);font-weight:800}.jd-cond{color:var(--out);font-weight:800}
tr.insp-ng td{background:rgba(255,123,123,.07)}
.qbx2{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px}
.qfbox{border:1px dashed var(--line);border-radius:13px;padding:12px 13px 4px;margin-bottom:14px;position:relative}
.qfbox>.qflb{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 8px;font-size:11px;font-weight:800;color:var(--gray);letter-spacing:1px}
.wrbtn{padding:9px 16px;border-radius:10px;border:1px solid var(--goldbd);background:var(--goldbg);color:var(--gold);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.wrbtn.open{background:var(--gold);color:#1a1d27}

/* 검사성적: 탭 + 공정 기준 성적서 양식 */
.itabs{display:flex;gap:6px;margin:0 0 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px}
.itab{flex:1;padding:11px 10px;border-radius:9px;border:none;background:transparent;color:var(--sub);
  font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.itab.on{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldbd)}
.itab:not(.on):hover{color:var(--ink);background:rgba(255,255,255,.04)}
.ifm-sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--gray);margin:0 2px 10px}
.ifm-sum b{color:var(--gold)}
.ifm-op{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.ifm-oph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line2);background:rgba(226,176,74,.05)}
.ifm-oph .no{font-size:13px;font-weight:900;color:var(--gold);font-family:ui-monospace,monospace}
.ifm-oph .nm{font-size:13px;font-weight:800;color:var(--ink)}
.ifm-oph .cnt{font-size:10.5px;color:var(--gray)}
.ifm-oph .acts{margin-left:auto;display:flex;gap:5px}
.ifm-oph .acts button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.ifm-oph .acts button:hover{border-color:var(--goldbd);color:var(--gold)}
.ifm-rows{padding:8px 10px 12px}
.ifm-row{display:grid;grid-template-columns:26px minmax(120px,1.5fr) 118px 108px 96px minmax(100px,1fr) 30px;
  gap:7px;align-items:end;padding:8px 4px;border-bottom:1px dashed var(--line2)}
.ifm-row:last-child{border-bottom:none}
.ifm-row.ng{background:rgba(255,123,123,.07);border-radius:9px}
.ifm-row.ok{background:rgba(126,224,160,.05);border-radius:9px}

/* PC 화면별 폭 조절 + 글자 크기 조절 ----------------------------------
   - 헤더 우측 📐 버튼을 눌러 팝업으로 조절
   - 화면 폭 : 메뉴별 720~1400px 실시간 조절 (PC 전용)
   - 글자 크기 : 본문·모달 전체 80~150% 확대/축소 (PC·모바일 공통)
   - 설정값은 브라우저 localStorage에 자동 저장
   - 모바일(760px 이하)에서는 글자 크기만 노출 */
.pcwmenu{display:block;position:relative;flex-shrink:0}
header .hright{position:relative}
@media(min-width:761px){
  header{
    padding-left:max(calc(16px * var(--mm-fs,1)),calc((100vw - var(--pc-active-width,1020px) * var(--mm-fs,1)) / 2 + 16px * var(--mm-fs,1)));
    padding-right:max(calc(16px * var(--mm-fs,1)),calc((100vw - var(--pc-active-width,1020px) * var(--mm-fs,1)) / 2 + 16px * var(--mm-fs,1)));
    transition:padding .18s ease;
  }
  main{max-width:none}
  main>section{
    width:min(var(--pc-view-width,1020px),100%);
    max-width:none;
    position:relative;
    left:auto;
    transform:none;
    margin-left:auto;
    margin-right:auto;
    transition:width .12s ease;
  }
  #mxwrap{
    width:100%;
    position:static;
    left:auto;
    transform:none;
  }
}
@media all{
  .pcwbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;font-family:inherit;transition:.15s;padding:0}
  .pcwbtn:hover,.pcwbtn.on{border-color:var(--goldbd);background:var(--goldbg);color:var(--gold)}
  .pcwpopup{position:absolute;right:0;top:calc(100% + 10px);width:300px;padding:13px 14px 12px;border:1px solid var(--line3);border-radius:13px;background:#171a24;box-shadow:0 14px 38px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .14s ease,transform .14s ease,visibility .14s;z-index:150;color:var(--ink)}
  .pcwpopup.show{opacity:1;visibility:visible;transform:none}
  .pcwpopup:before{content:'';position:absolute;right:9px;top:-6px;width:10px;height:10px;background:#171a24;border-left:1px solid var(--line3);border-top:1px solid var(--line3);transform:rotate(45deg)}
  .pcwpophead{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line2)}
  .pcwpophead b{font-size:12.5px;color:var(--gold);font-weight:800}
  .pcwclose{margin-left:auto;width:24px;height:24px;border:none;background:transparent;color:var(--gray);font-size:17px;line-height:1;cursor:pointer;border-radius:6px}
  .pcwclose:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .pcwrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11.5px;color:var(--sub)}
  .pcwrow b{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px}
  .pcwrange{width:100%;height:24px;accent-color:var(--gold);cursor:pointer;display:block}
  .pcwscale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--gray);font-family:'IBM Plex Mono',monospace;margin-top:-2px}
  .pcwfoot{display:flex;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
  .pcwsaved{font-size:10.5px;color:var(--green);white-space:nowrap}
  .pcwreset{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card2);color:var(--sub);font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pcwreset:hover{border-color:var(--goldbd);color:var(--gold)}
  .pcwfs{margin-top:12px}
  .pfsquick{display:flex;gap:6px;margin-top:8px}
  .pfsquick button{flex:1;padding:7px 4px;border:1px solid var(--line);border-radius:7px;background:var(--card2);color:var(--sub);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .pfsquick button:hover{border-color:var(--goldbd);color:var(--gold)}
  .pfsquick button.on{background:var(--goldbg);border-color:var(--goldbd);color:var(--gold)}
}
@media(max-width:760px){
  .pcwbtn{width:28px;height:28px;font-size:14px}
  .pcwpopup{width:min(290px,calc(100vw - 26px))}
  .pcw-width-only{display:none}
  .pcwfs{margin-top:0}
}

@media(max-width:760px){
  header .rev{display:none}
  header .hright{gap:6px}
  .ubadge{max-width:86px;overflow:hidden;text-overflow:ellipsis}
  .mxtbl th.stick{min-width:110px}
  .mxtbl tbody th.stick span{max-width:110px}
  .mxtip{display:none}
  .stats{gap:6px}

  .op{grid-template-columns:52px 1fr}
  .row2{grid-template-columns:1fr}
  .hstep{grid-template-columns:44px 1fr}
  .htbl td:first-child{width:auto}

}

/* ================= 설정 ================= */
const BASE="https://pllwltojbofjaftcemvn.supabase.co";
const URL_=BASE+"/rest/v1";
const KEY="sb_publishable_9dYJzdz472b888EcqdBBaA_Ncwk0yvT";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};

const SESS_KEY='mm_session', SESS_DAYS=7;
function readSession(){
  try{
    const o=JSON.parse(localStorage.getItem(SESS_KEY)||'null');
    if(o&&o.exp>Date.now()){
      localStorage.setItem(SESS_KEY,JSON.stringify({name:o.name,exp:Date.now()+SESS_DAYS*864e5}));
      sessionStorage.setItem('mm_user',o.name);return o.name;
    }
    if(o)localStorage.removeItem(SESS_KEY);
  }catch(e){}
  return sessionStorage.getItem('mm_user')||null;
}
let USER=readSession();

async function api(path,opt={}){
  const r=await fetch(URL_+path,{headers:{...H,Prefer:opt.method&&opt.method!=="GET"?"return=representation":""},...opt});
  if(!r.ok){const t=await r.text();throw new Error(t)}
  if(r.status===204)return null;
  return r.json();
}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function g(id){const el=document.getElementById(id);return el?el.value.trim():''}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function num(v){const n=Number(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(n)?n:0}
function won(n){return (Math.round(num(n))).toLocaleString('ko-KR')}
function dayDiff(a,b){if(!a||!b)return null;return Math.round((new Date(b)-new Date(a))/864e5)}


/* ================= 권한 확인 ================= */
const ROLES={'관리자':{money:1,admin:1},'영업':{money:1},'설계':{money:0},
  '구매':{money:1},'가공조립':{money:0},'품질':{money:0},'조회':{money:0,readonly:1}};

try{ROLE=sessionStorage.getItem('mm_role')||localStorage.getItem('mm_role')||'관리자'}catch(e){}
if(!ROLES[ROLE])ROLE='조회';

function isReadonly(){return !!(ROLES[ROLE]||{}).readonly}

/* ================= 상태 ================= */
let PROJ=[], CURP=null, ROWS=[], VEND=[], MATS=[], PRICE=[];
let DIRTY=new Map(), NEWR=[], TAB='po';

const PH={kind:'자재',item_name:'예: 상형 홀더',spec:'예: 300x200x50',material:'예: SKD11',

const PCOLS=[['kind',''],['item_name',''],['spec',''],['material',''],
  ['qty','num'],['unit',''],['price','num'],

async function loadRows(){

  DIRTY.clear();NEWR=[];
  CURP=document.getElementById('msel').value||null;

}

/* ================= 단가 자동 조회 ================= */
function findPrice(item,spec,material,vendor){
  const norm=v=>String(v||'').trim().toLowerCase();
  const cands=PRICE.filter(p=>p.kind==='자재'||!p.kind);
  const score=p=>{
    let s=0;
    if(norm(p.item_name)&&norm(p.item_name)===norm(item))s+=8;
    if(norm(p.spec)&&norm(p.spec)===norm(spec))s+=4;
    if(norm(p.material)&&norm(p.material)===norm(material))s+=3;
    if(norm(p.vendor)&&norm(p.vendor)===norm(vendor))s+=2;
    if(norm(p.vendor)&&vendor&&norm(p.vendor)!==norm(vendor))s-=5;
    return s;
  };
  let best=null,bs=0;
  cands.forEach(p=>{const s=score(p);if(s>bs){bs=s;best=p}});
  return bs>=3&&best?num(best.price):null;
}

/* ================= 렌더 ================= */
function stat(r){
  if(r.in_date)return '입고';
  if(r.order_date)return '발주';
  return '미발주';
}
function stCls(s){return s==='입고'?'st-ok':s==='발주'?'st-r':'st-w'}
function lateDays(r){
  if(!r.due_date)return null;
  const end=r.in_date||today();
  const d=dayDiff(r.due_date,end);
  return d>0?d:null;
}
function render(){
  if(TAB==='po')renderPO(); else renderIN();
  renderSum();
}
function renderSum(){
  const all=merged();
  const no=all.filter(r=>!r.order_date).length;
  const od=all.filter(r=>r.order_date&&!r.in_date).length;
  const ind=all.filter(r=>r.in_date).length;
  const amt=all.reduce((s,r)=>s+num(r.qty)*num(r.price),0);
  document.getElementById('m-sum').innerHTML=
    `미발주 <b>${no}</b> <span class="sp">·</span> 발주 <b>${od}</b> <span class="sp">·</span> 입고 <b>${ind}</b>`+
    (canMoney()?` <span class="sp">·</span> 금액 <b class="mono">${won(amt)}</b>원`:'');
  const late=all.filter(r=>lateDays(r)).length;
  const isum=document.getElementById('i-sum');
  if(isum)isum.innerHTML=`입고 <b>${ind}</b>/${all.length} <span class="sp">·</span> 지연 <b style="color:var(--red)">${late}</b>건`
    +` <span class="sp">·</span> 입고금액 <b class="mono">${won(all.filter(r=>r.in_date).reduce((s,r)=>s+num(r.qty)*num(r.price),0))}</b>원`;
}
function merged(){
  return ROWS.map(r=>Object.assign({},r,DIRTY.get(r.id)||{})).concat(NEWR);
}
function pMark(){
  const n=DIRTY.size+NEWR.filter(r=>r.item_name&&r.item_name.trim()).length;
  const el=document.getElementById('p-dirty');if(el)el.textContent=n?'('+n+')':'';
}
function renderPO(){
  const tb=document.getElementById('pbody');if(!tb)return;
  const line=(r,i,isNew)=>{
    const st=isNew?'신규':stat(r);
    const key=isNew?'n'+i:r.id;
    const amt=num(r.qty)*num(r.price);
    const late=!isNew&&lateDays(r);
    return `<tr class="${isNew?'mt-new':(st==='입고'?'mt-ok':'')}${late?' mt-late':''}" data-key="${key}">`+
      `<td style="text-align:center"><input type="checkbox" class="pck" onchange="poSelCnt()" style="width:15px;height:15px"></td>`+
      `<td class="mono" style="text-align:center;color:var(--gray)">${i+1}</td>`+
      PCOLS.map(([f,cls],ci)=>{
        const v=r[f]==null?'':r[f];
        const type=cls==='date'?'date':cls==='num'?'number':'text';
        const dl=f==='vendor'?'vendlist':f==='material'?'matlist':f==='item_name'?'itemlist':f==='unit'?'unitlist':f==='kind'?'kindlist':'';
        const ph=PH[f]||'';
        const pm=(f==='price')?' class="perm-money"':'';
        return `<td${pm}><input class="mti ${cls}" type="${type}" value="${esc(v)}"${dl?` list="${dl}"`:''}${ph?` placeholder="${ph}"`:''}
          oninput="pEdit('${key}','${f}',this.value)" onchange="pChg('${key}','${f}')" onkeydown="pKey(event,this)"></td>`
          +(f==='price'?`<td class="amt perm-money" data-amt="${key}">${amt?won(amt):''}</td>`:'');
      }).join('')+
      `<td style="text-align:center"><span class="st ${isNew?'st-w':stCls(st)}">${st}</span></td>`+
      `<td style="text-align:center">${isNew
        ? `<button class="del" onclick="pDelNew(${i-ROWS.length})">✕</button>`
        : `<button class="del" onclick="pDel(${r.id})">✕</button>`}</td></tr>`;
  };
  const base=ROWS.map(r=>Object.assign({},r,DIRTY.get(r.id)||{}));
  tb.innerHTML=base.map((r,i)=>line(r,i,false)).join('')
    +NEWR.map((r,i)=>line(r,ROWS.length+i,true)).join('')
    ||'<tr><td colspan="18" class="empty">＋ 행 추가 또는 📦 자재 불러오기로 시작하세요</td></tr>';
  pMark();poSelCnt();checkWarn();
}
function renderIN(){
  const tb=document.getElementById('ibody');if(!tb)return;
  const list=merged().filter(r=>r.order_date);
  tb.innerHTML=list.map((r,i)=>{
    const st=stat(r), ld=lateDays(r);
    return `<tr${ld?' style="box-shadow:inset 3px 0 0 var(--red)"':''}>
      <td class="mono" style="text-align:center;color:var(--gray)">${i+1}</td>
      <td>${esc(r.item_name||'')}</td><td>${esc(r.spec||'')}</td><td>${esc(r.material||'')}</td>
      <td class="mono" style="text-align:right">${esc(r.qty||'')} ${esc(r.unit||'')}</td>
      <td>${esc(r.vendor||'')}</td>
      <td class="mono">${esc(r.order_date||'')}</td>
      <td class="mono">${esc(r.due_date||'')}</td>
      <td class="mono">${esc(r.in_date||'')}</td>
      <td class="mono" style="text-align:center;color:${ld?'var(--red)':'var(--gray)'}">${ld?'+'+ld+'일':'-'}</td>
      <td class="amt perm-money">${won(num(r.qty)*num(r.price))}</td>
      <td style="text-align:center"><span class="st ${stCls(st)}">${st}</span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="12" class="empty">발주된 자재가 없습니다</td></tr>';
}
function mTab(t){
  TAB=t;
  ['po','in'].forEach(x=>{
    document.getElementById('mtab-'+x).classList.toggle('on',x===t);
    document.getElementById('pane-'+x).classList.toggle('hide',x!==t);
  });
  if(t==='po'){const bo=document.getElementById('bk-order');if(bo&&!bo.value)bo.value=today();}
  render();
}

/* ================= 날짜 역전 검증 ================= */
function dateErrs(){
  const errs=[];
  merged().forEach((r,i)=>{
    const nm=r.item_name||('#'+(i+1));
    if(r.order_date&&r.due_date&&r.due_date<r.order_date)errs.push(`${nm}: 입고요구일이 발주일보다 빠릅니다`);
    if(r.order_date&&r.in_date&&r.in_date<r.order_date)errs.push(`${nm}: 입고일이 발주일보다 빠릅니다`);
    if(!r.order_date&&r.in_date)errs.push(`${nm}: 발주일 없이 입고일이 입력되었습니다`);
  });
  return errs;
}
function checkWarn(){
  const box=document.getElementById('p-warn');if(!box)return [];
  const e=dateErrs();
  box.classList.toggle('show',e.length>0);
  box.innerHTML=e.length?'⚠ 일자 오류 '+e.length+'건<br>'+e.slice(0,6).map(esc).join('<br>')+(e.length>6?'<br>…':''):'';
  return e;
}

/* ================= 편집 ================= */
function pEdit(key,f,v){
  if(String(key).startsWith('n')){
    const i=Number(String(key).slice(1))-ROWS.length;
    if(NEWR[i])NEWR[i][f]=v;
  }else{
    const id=Number(key);
    const o=DIRTY.get(id)||{};o[f]=v;DIRTY.set(id,o);
  }
  if(f==='qty'||f==='price')updAmt(key);
  pMark();renderSum();
}
function rowOf(key){
  if(String(key).startsWith('n'))return NEWR[Number(String(key).slice(1))-ROWS.length]||{};
  const id=Number(key);
  return Object.assign({},ROWS.find(r=>r.id===id)||{},DIRTY.get(id)||{});
}
function updAmt(key){
  const r=rowOf(key);
  const td=document.querySelector(`[data-amt="${key}"]`);
  if(td){const a=num(r.qty)*num(r.price);td.textContent=a?won(a):''}
}
function pChg(key,f){
  const r=rowOf(key);
  /* 단가 자동입력: 단가가 비어 있을 때만 */
  if(['item_name','spec','material','vendor'].includes(f)&&!num(r.price)){
    const p=findPrice(r.item_name,r.spec,r.material,r.vendor);
    if(p){
      pEdit(key,'price',p);
      const tr=document.querySelector(`tr[data-key="${key}"]`);
      if(tr){const ins=[...tr.querySelectorAll('input.mti')];const ci=PCOLS.findIndex(c=>c[0]==='price');if(ins[ci])ins[ci].value=p;}
      toast('단가표에서 자동입력: '+won(p)+'원');
    }
  }
  if(['order_date','due_date','in_date'].includes(f)){
    const e=checkWarn();
    if(e.length)toast('⚠ 일자 확인 필요 — 저장 전 수정하세요');
  }
  renderSum();
}
function pKey(e,el){
  const tr=el.closest('tr');
  const ins=[...tr.querySelectorAll('input.mti')];
  const ci=ins.indexOf(el);
  const rows=[...document.querySelectorAll('#pbody tr')];
  const ri=rows.indexOf(tr);
  if(e.key==='Enter'){
    e.preventDefault();
    let nx=rows[ri+1];
    if(!nx){poAddRow();nx=[...document.querySelectorAll('#pbody tr')][ri+1]}
    if(nx){const t=[...nx.querySelectorAll('input.mti')][ci];if(t){t.focus();t.select&&t.select()}}
  }
}
function poAddRow(){
  NEWR.push({kind:'자재',item_name:'',spec:'',material:'',qty:'',unit:'EA',price:'',vendor:'',
    order_date:g('bk-order')||today(),due_date:'',in_date:'',memo:''});
  renderPO();
  const rows=[...document.querySelectorAll('#pbody tr')];
  const last=rows[rows.length-1];
  if(last){const t=[...last.querySelectorAll('input.mti')][1];if(t)t.focus()}
}
function pDelNew(i){NEWR.splice(i,1);renderPO();renderSum()}
async function pDel(id){
  if(!confirm('이 행을 삭제할까요?'))return;
  try{await api('/mm_material_po?id=eq.'+id,{method:'DELETE'});DIRTY.delete(id);await loadRows();toast('삭제 완료')}
  catch(e){toast('삭제 실패: '+e.message)}
}

/* ================= 선택/일괄 ================= */
function poSelAll(on){document.querySelectorAll('#pbody .pck').forEach(c=>c.checked=on);poSelCnt()}
function poSelCnt(){
  const n=document.querySelectorAll('#pbody .pck:checked').length;
  const el=document.getElementById('p-sel');
  if(el){el.textContent='선택 '+n+'행';el.classList.toggle('on',n>0)}
}
function bulkToday(id){document.getElementById(id).value=today()}
function bulkApply(){
  const trs=[...document.querySelectorAll('#pbody tr')].filter(t=>{const c=t.querySelector('.pck');return c&&c.checked});
  if(!trs.length)return toast('적용할 행을 선택하세요');
  const map={vendor:g('bk-vendor'),material:g('bk-mat'),order_date:g('bk-order'),due_date:g('bk-due'),in_date:g('bk-in')};
  const fields=Object.keys(map).filter(k=>map[k]);
  if(!fields.length)return toast('적용할 값을 입력하세요');
  trs.forEach(tr=>{
    const key=tr.dataset.key;
    const ins=[...tr.querySelectorAll('input.mti')];
    fields.forEach(f=>{
      const ci=PCOLS.findIndex(c=>c[0]===f);
      if(ci<0||!ins[ci])return;
      ins[ci].value=map[f];pEdit(key,f,map[f]);
    });
    pChg(key,'vendor');
  });
  const e=checkWarn();
  toast(trs.length+'행에 적용'+(e.length?' — ⚠ 일자 오류 '+e.length+'건':' — 💾 일괄 저장을 눌러 확정하세요'));
}

/* 엑셀 붙여넣기 */
document.addEventListener('paste',function(e){
  const el=e.target;
  if(!el.classList||!el.classList.contains('mti'))return;
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!txt||(txt.indexOf('\t')<0&&txt.indexOf('\n')<0))return;
  e.preventDefault();
  const rows=[...document.querySelectorAll('#pbody tr')];
  const tr=el.closest('tr'); const ri=rows.indexOf(tr);
  const ci=[...tr.querySelectorAll('input.mti')].indexOf(el);
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.length);
  const need=ri+lines.length-rows.length;
  for(let k=0;k<need;k++)NEWR.push({kind:'자재',item_name:'',spec:'',material:'',qty:'',unit:'EA',price:'',vendor:'',order_date:'',due_date:'',in_date:'',memo:''});
  if(need>0)renderPO();
  const rows2=[...document.querySelectorAll('#pbody tr')];
  lines.forEach((ln,r)=>{
    const tgt=rows2[ri+r];if(!tgt)return;
    const ins=[...tgt.querySelectorAll('input.mti')];
    ln.split('\t').forEach((cell,c)=>{
      const idx=ci+c;
      if(idx>=PCOLS.length||!ins[idx])return;
      const v=cell.trim();ins[idx].value=v;pEdit(tgt.dataset.key,PCOLS[idx][0],v);
    });
    pChg(tgt.dataset.key,'vendor');
  });
  checkWarn();
  toast(lines.length+'행 붙여넣기 — 💾 일괄 저장을 눌러 확정하세요');
});

/* ================= 저장 ================= */
function clean(o){
  const b={};
  PCOLS.forEach(([f,cls])=>{
    if(!(f in o))return;
    let v=o[f];
    if(v===''||v==null){b[f]=null;return}
    b[f]=cls==='num'?num(v):v;
  });
  return b;
}
async function poSave(){
  const errs=checkWarn();
  if(errs.length){
    if(!confirm('일자 오류 '+errs.length+'건이 있습니다.\n\n'+errs.slice(0,5).join('\n')+'\n\n그래도 저장할까요?'))return;
  }
  const news=NEWR.filter(r=>r.item_name&&r.item_name.trim());
  if(!DIRTY.size&&!news.length)return toast('변경된 내용이 없습니다');
  let ok=0,er=0;
  for(const [id,o] of DIRTY){
    try{await api('/mm_material_po?id=eq.'+id,{method:'PATCH',body:JSON.stringify(clean(o))});ok++}
    catch(e){er++}
  }
  if(news.length){
    try{
      await api('/mm_material_po',{method:'POST',body:JSON.stringify(news.map(r=>Object.assign(clean(r),{project_id:CURP,worker:USER||null})))});
      ok+=news.length;
    }catch(e){er+=news.length;toast('신규 저장 실패: '+e.message)}
  }
  DIRTY.clear();NEWR=[];
  await loadBase();await loadRows();
  toast(ok+'건 저장'+(er?' · 실패 '+er:''));
}

/* ================= 엑셀 ================= */
function csv(rows,name){
  const bom='\uFEFF';
  const body=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bom+body],{type:'text/csv;charset=utf-8'}));
  a.download=name;a.click();
}
function pjName(){const p=PROJ.find(x=>x.id===CURP);return p?p.mold_no:'자재'}
function poXls(){
  const hd=['구분','품목명','규격','재질','수량','단위','단가','금액','구매처','발주일','입고요구일','입고일','비고','상태'];
  const rows=merged().map(r=>[r.kind,r.item_name,r.spec,r.material,r.qty,r.unit,r.price,
    num(r.qty)*num(r.price),r.vendor,r.order_date,r.due_date,r.in_date,r.memo,stat(r)]);
  csv([hd,...rows],pjName()+'_자재발주.csv');
}
function inXls(){
  const hd=['품목명','규격','재질','수량','단위','구매처','발주일','요구일','입고일','지연일','금액','상태'];
  const rows=merged().filter(r=>r.order_date).map(r=>[r.item_name,r.spec,r.material,r.qty,r.unit,r.vendor,
    r.order_date,r.due_date,r.in_date,lateDays(r)||'',num(r.qty)*num(r.price),stat(r)]);
  csv([hd,...rows],pjName()+'_자재입고현황.csv');
}

/* ---------- 글자크기 ---------- */
const FS_KEY='mm_font_scale_v1';
let MM_FS=100;
function fsClamp(v){let n=Number(v)||100;n=Math.round(n/5)*5;return Math.max(80,Math.min(150,n))}
function applyFontScale(v,save){
  MM_FS=fsClamp(v);
  document.documentElement.style.setProperty('--mm-fs',(MM_FS/100).toString());
  const rg=document.getElementById('pfsRange');if(rg)rg.value=MM_FS;
  const vl=document.getElementById('pfsValue');if(vl)vl.textContent=MM_FS+'%';
  if(save){try{localStorage.setItem(FS_KEY,String(MM_FS))}catch(e){}}
}
function previewFontScale(v){applyFontScale(v,false)}
function saveFontScale(v){applyFontScale(v,true)}
function stepFontScale(d){saveFontScale(MM_FS+d)}
function togglePCWidthPopup(e){
  if(e)e.stopPropagation();
  const p=document.getElementById('pcWidthPopup'),b=document.getElementById('pcWidthBtn');
  const on=!p.classList.contains('show');
  p.classList.toggle('show',on);b.classList.toggle('on',on);
}
function closePCWidthPopup(){
  document.getElementById('pcWidthPopup').classList.remove('show');
  document.getElementById('pcWidthBtn').classList.remove('on');
}
document.addEventListener('click',closePCWidthPopup);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePCWidthPopup();closeTpl()}});

<script>
/* ===== 데이터시트 행번호 자동 부여 (.tscroll 내 표) ===== */
(function(){
  var BUSY=false;
  var SKIP=/^(no|#|순|순번|번호|seq)$/i;
  function hasOwnNum(tb){
    var th=tb.tHead&&tb.tHead.rows[0]&&tb.tHead.rows[0].cells[0];
    if(!th)return false;
    if(th.classList.contains('rnum'))return false;
    return SKIP.test((th.textContent||'').trim());
  }
  function numberOne(tb){
    if(tb.hasAttribute('data-nonum'))return;
    if(hasOwnNum(tb)){tb.setAttribute('data-nonum','');return}
    var head=tb.tHead&&tb.tHead.rows[0];
    if(head&&!(head.cells[0]&&head.cells[0].classList.contains('rnum'))){
      var th=document.createElement('th');
      th.className='rnum';th.textContent='';
      head.insertBefore(th,head.cells[0]||null);
      /* thead가 2줄 이상이면 나머지 줄도 자리 확보 */
      for(var r=1;r<tb.tHead.rows.length;r++){
        var hr=tb.tHead.rows[r];
        if(hr.cells[0]&&hr.cells[0].classList.contains('rnum'))continue;
        var th2=document.createElement('th');th2.className='rnum';
        hr.insertBefore(th2,hr.cells[0]||null);
      }
    }
    var bodies=tb.tBodies,n=0;
    for(var b=0;b<bodies.length;b++){
      var rows=bodies[b].rows;
      for(var i=0;i<rows.length;i++){
        var tr=rows[i],c0=tr.cells[0];
        if(c0&&c0.classList.contains('rnum')){
          if(c0.getAttribute('data-empty')!=='1')c0.textContent=++n;
          continue;
        }
        var only=tr.cells.length===1&&c0&&(c0.colSpan>1||c0.classList.contains('empty'));
        var td=document.createElement('td');
        td.className='rnum';
        if(only){td.setAttribute('data-empty','1');td.textContent='';}
        else td.textContent=++n;
        tr.insertBefore(td,c0||null);
      }
    }
  }
  function run(){
    if(BUSY)return;BUSY=true;
    try{
      document.querySelectorAll('.tscroll > table, .tscroll table').forEach(numberOne);
    }catch(e){}
    BUSY=false;
  }
  function watch(){
    run();
    var mo=new MutationObserver(function(){
      if(BUSY)return;
      clearTimeout(watch._t);
      watch._t=setTimeout(run,40);
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);
  else watch();
})();
</script>
