<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>온습도 모니터링 — 금형제작관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--card:#171a24;--card2:#1c202b;--line:#252a38;--line2:#20242f;
  --ink:#e8ecf4;--sub:#9aa4b8;--gray:#6b7488;
  --gold:#e2b04a;--gold2:#f6d365;--goldbg:rgba(226,176,74,.12);--goldbd:rgba(226,176,74,.4);
  --blue:#4f8cff;--green:#7ee0a0;--red:#ff7b7b;--orange:#f0a04b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
.gold-txt{background:linear-gradient(120deg,var(--gold2),var(--gold),var(--gold2));background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:250% center}}

header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:11px;padding:11px 14px;
  background:linear-gradient(180deg,#181b26,#0f1117ee);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--gold);font-size:18px;cursor:pointer;flex-shrink:0}
h1{font-size:17px;font-weight:900;letter-spacing:-.3px;margin:0;flex:1}
.rev{font-size:10px;color:var(--sub);border:1px solid var(--line);padding:1px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;opacity:.75}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(126,224,160,.7);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.35}}

main{max-width:1180px;margin:0 auto;padding:14px;zoom:var(--mm-fs,1)}
.pcwmenu{position:relative;flex-shrink:0}
.pcwbtn{width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;font-family:inherit;padding:0;transition:.15s}
.pcwbtn:active,.pcwbtn.on{border-color:var(--goldbd);background:var(--goldbg);color:var(--gold)}
.pcwpopup{position:absolute;right:0;top:calc(100% + 10px);width:min(290px,calc(100vw - 26px));padding:13px 14px 12px;
  border:1px solid var(--line);border-radius:13px;background:#171a24;box-shadow:0 14px 38px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .14s ease,transform .14s ease,visibility .14s;z-index:150;color:var(--ink)}
.pcwpopup.show{opacity:1;visibility:visible;transform:none}
.pcwpopup:before{content:'';position:absolute;right:9px;top:-6px;width:10px;height:10px;background:#171a24;
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.pcwpophead{display:flex;align-items:center;gap:8px;padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.pcwpophead b{font-size:12.5px;color:var(--gold);font-weight:800}
.pcwclose{margin-left:auto;width:24px;height:24px;border:none;background:transparent;color:var(--gray);font-size:17px;line-height:1;cursor:pointer;border-radius:6px}
.pcwrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11.5px;color:var(--sub)}
.pcwrow b{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px}
.pcwrange{width:100%;height:24px;accent-color:var(--gold);cursor:pointer;display:block}
.pcwscale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--gray);font-family:'IBM Plex Mono',monospace;margin-top:-2px}
.pfsquick{display:flex;gap:6px;margin-top:8px}
.pfsquick button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:7px;background:var(--card2);
  color:var(--sub);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.pfsquick button:active{border-color:var(--goldbd);color:var(--gold)}
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.sum .v{font-size:22px;font-weight:900;font-family:'IBM Plex Mono',monospace}
.sum .k{font-size:11px;color:var(--sub);font-weight:700}
.sum.ok .v{color:var(--green)}.sum.warn .v{color:var(--orange)}.sum.bad .v{color:var(--red)}.sum.all .v{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px 11px;position:relative;overflow:hidden}
.sc:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.sc.ok:before{background:var(--green)}
.sc.warn:before{background:var(--orange)}
.sc.bad:before{background:var(--red)}
.sc.off{opacity:.62}
.sc .h{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
  background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.nm{font-size:14px;font-weight:800;color:var(--ink)}
.st{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--gray)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--gray);display:block}
.st.ok{color:var(--green)}.st.ok i{background:var(--green)}
.st.warn{color:var(--orange)}.st.warn i{background:var(--orange)}
.st.bad{color:var(--red)}.st.bad i{background:var(--red)}

.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.vl .k{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:2px}
.vl .v{font-size:26px;font-weight:900;font-family:'IBM Plex Mono',monospace;line-height:1.1}
.vl .v span{font-size:12px;font-weight:700;margin-left:1px}
.vl.t .v{color:var(--gold2)}
.vl.h .v{color:var(--blue)}
.vl.f .v{color:var(--ink)}
.vl.f.bad .v{color:var(--red)}
.vl.f.warn .v{color:var(--orange)}
.sc .ft{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:10.5px;color:var(--gray)}
.sc .ft .ago{margin-left:auto}
.spark{display:flex;align-items:flex-end;gap:2px;height:20px;flex:1}
.spark i{flex:1;background:rgba(226,176,74,.35);border-radius:1px;display:block}

.note{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:12px;color:var(--sub);line-height:1.7}
.note b{color:var(--gold)}
.note .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.chip.g{background:var(--goldbg);border-color:var(--goldbd);color:var(--gold)}
@media(max-width:560px){
  .sumbar{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .vl .v{font-size:24px}
}

/* ===== 화면 테마 ===== */
html[data-theme="mono"]{
  --bg:#ffffff; --card:#ffffff; --card2:#f2f2f2; --navy:#ffffff; --navy2:#ebebeb;
  --drawer:#ffffff; --drawerbd:#000000;
  --ink:#000000; --sub:#000000; --gray:#3d3d3d;
  --gold:#000000; --gold2:#000000; --gold3:#000000;
  --goldbg:#e6e6e6; --goldbd:#000000;
  --yellow:#000000; --yellowbg:#e6e6e6;
  --blue:#000000; --red:#000000; --green:#000000;
  --cust:#000000; --self:#000000; --out:#000000;
  --line:#000000; --line2:#8a8a8a; --line3:#000000; --line4:#000000;
}
html[data-theme="mono"] body{color-scheme:light;background:#fff;color:#000}
html[data-theme="mono"] .gold-txt{-webkit-text-fill-color:initial;background:none;color:#000;animation:none}
html[data-theme="mono"] header{background:#fff}
html[data-theme="mono"] .toast{background:#000;color:#fff;border-color:#000}
html[data-theme="mono"] .pcwpopup,
html[data-theme="mono"] .pcwpopup:before{background:#fff;border-color:#000}
html[data-theme="mono"] .modal{background:rgba(0,0,0,.45)}
html[data-theme="mono"] .inspplan-tbl th{background:#e6e6e6;color:#000}
html[data-theme="mono"] .st,
html[data-theme="mono"] .badge,
html[data-theme="mono"] .ngc,
html[data-theme="mono"] .stat .v,
html[data-theme="mono"] .cd{color:#000!important}
html[data-theme="mono"] .st{background:#fff!important;border:1px solid #000!important}
html[data-theme="mono"] .st.ok{background:#000!important;color:#fff!important}
html[data-theme="mono"] .st.run{background:#d9d9d9!important}
html[data-theme="mono"] .st.ng{background:#fff!important;text-decoration:underline}
html[data-theme="mono"] .btn,
html[data-theme="mono"] .mi,
html[data-theme="mono"] input,
html[data-theme="mono"] select,
html[data-theme="mono"] textarea{color:#000!important}
html[data-theme="mono"] .btn[style*="background"],
html[data-theme="mono"] button[style*="background"]{background:#fff!important;border:1px solid #000!important;color:#000!important}
html[data-theme="mono"] .btn-p,
html[data-theme="mono"] .wrbtn.open,
html[data-theme="mono"] .itab.on,
html[data-theme="mono"] .mi.on,
html[data-theme="mono"] .pfilter button.on,
html[data-theme="mono"] .thm.on,
html[data-theme="mono"] .pfsquick button.on{background:#000!important;color:#fff!important;border-color:#000!important}
html[data-theme="mono"] .monbig{background:#f2f2f2!important;border-color:#000!important;box-shadow:none}
html[data-theme="mono"] .monbig .tx,
html[data-theme="mono"] .monbig .go,
html[data-theme="mono"] .monbig .tx em{color:#000!important}
html[data-theme="mono"] .wizbtn{background:#fff!important;color:#000!important;border-color:#000!important;box-shadow:none}

html[data-theme="mono"].bd-1,html[data-theme="mono"].bd-2,html[data-theme="mono"].bd-3{
  --line:#000000; --line2:#8a8a8a; --line3:#000000; --line4:#000000}



/* ===== PC(1000px+) MES 스타일: 직각 · 고딕 ===== */
@media(min-width:1000px){
  body{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif}
  *{border-radius:0!important}
}

/* 표 복사 버튼 (시트 복붙용) */
.tscroll{position:relative}
.tcopy{position:absolute;top:5px;right:5px;z-index:5;display:none;
  padding:4px 10px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--sub)}
.tscroll:hover .tcopy{display:block}
.tcopy:hover{color:var(--gold);border-color:var(--goldbd);background:var(--goldbg)}
table.wide,table.wide th,table.wide td{user-select:text;-webkit-user-select:text}

/* ============================================================
   PC 타이포그래피 — 네이버 계열 폰트 스택
   ============================================================ */
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','나눔고딕','NanumGothic',Dotum,'돋움',sans-serif;
  letter-spacing:-.3px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea,table,th,td{font-family:inherit}
h1,h2,h3,h4,b,strong{letter-spacing:-.4px}
th{letter-spacing:-.3px;font-weight:700}
.mono,input.mono,td.mono,.rev,.htitle{letter-spacing:-.1px}
.mono,input.mono,td.mono,.rev{font-family:'Malgun Gothic','Consolas','IBM Plex Mono',monospace;letter-spacing:0}
}
</style>
</head>
<body>

<header>
  <button class="back" onclick="location.href='index.html'">←</button>
  <h1 class="gold-txt">온습도 모니터링</h1>
  <span class="rev">DEMO</span>
  <span class="live"><i class="dot"></i><span id="lv">실시간</span></span>
  <div class="pcwmenu">
    <button id="pcWidthBtn" class="pcwbtn" type="button" title="글자 크기 설정" onclick="togglePop(event)">📐</button>
    <div id="pcWidthPopup" class="pcwpopup" role="dialog" onclick="event.stopPropagation()">
      <div class="pcwpophead"><b>화면 설정</b>
        <button class="pcwclose" type="button" onclick="closePop()">×</button></div>
      <div class="pcwrow"><span>글자 크기</span><b id="pfsValue">100%</b></div>
      <input id="pfsRange" class="pcwrange" type="range" min="80" max="150" step="5" value="100"
        oninput="applyFs(this.value,false)" onchange="applyFs(this.value,true)">
      <div class="pcwscale"><span>80%</span><span>150%</span></div>
      <div class="pfsquick">
        <button type="button" onclick="applyFs(MM_FS-5,true)">A−</button>
        <button type="button" onclick="applyFs(100,true)">100%</button>
        <button type="button" onclick="applyFs(MM_FS+5,true)">A+</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="sumbar" id="sum"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    <b>표시 항목</b> — 온도 · 습도 · 체감온도(고온다습 구간) / 결로여유(=현재온도 − 이슬점, 낮을수록 결로 위험).
    <div class="row">
      <span class="chip g">🔔 ntfy 임계치 알림</span>
      <span class="chip g">🚨 안돈(Andon) 표시등 연동</span>
      <span class="chip">📈 24시간 추이 기록</span>
      <span class="chip">📄 일/월 리포트 출력</span>
    </div>
    <div style="margin-top:8px">본 화면은 <b>데모</b>입니다. SHT41 등 센서 게이트웨이를 연결하면 실측값으로 대체됩니다.</div>
  </div>
</main>

<script>
/* ---------- 화면 테마 (index.html과 공유) ---------- */
(function(){
  try{
    var t=localStorage.getItem('mm_theme_v1')||'';if(t!=='mono'&&t!=='clean')t='';
    if(t){
      document.documentElement.setAttribute('data-theme',t);
      var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute('content',(t==='mono'||t==='clean'?'#ffffff':'#0f1117'));
    }
  }catch(e){}
})();

/* ===== 글자 크기 (index.html과 동일 키 공유) ===== */
const FS_KEY='mm_font_scale_v1';
let MM_FS=100;
function fsClamp(v){let n=Number(v)||100;n=Math.round(n/5)*5;return Math.max(80,Math.min(150,n))}
function applyFs(v,save){
  MM_FS=fsClamp(v);
  document.documentElement.style.setProperty('--mm-fs',(MM_FS/100).toString());
  const rg=document.getElementById('pfsRange');if(rg)rg.value=MM_FS;
  const vl=document.getElementById('pfsValue');if(vl)vl.textContent=MM_FS+'%';
  if(save){try{localStorage.setItem(FS_KEY,String(MM_FS))}catch(e){}}
}
function togglePop(e){
  if(e)e.stopPropagation();
  const p=document.getElementById('pcWidthPopup'),b=document.getElementById('pcWidthBtn');
  const on=!p.classList.contains('show');
  p.classList.toggle('show',on);b.classList.toggle('on',on);
}
function closePop(){
  document.getElementById('pcWidthPopup').classList.remove('show');
  document.getElementById('pcWidthBtn').classList.remove('on');
}
document.addEventListener('click',closePop);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
try{applyFs(localStorage.getItem(FS_KEY)||100,false)}catch(e){applyFs(100,false)}

/* ===== 구역 정의 (데모 기준값) ===== */
const ZONES=[
  {id:'SHT41_1', name:'A동',   t:24.5, h:52, mode:'auto'},
  {id:'SHT41_2', name:'B동',   t:26.8, h:74, mode:'auto'},
  {id:'SHT41_3', name:'창고',  t:29.4, h:61, mode:'auto'},
  {id:'SHT41_4', name:'조립실', t:23.2, h:48, mode:'auto'},
  {id:'SHT41_5', name:'가공실', t:27.6, h:56, mode:'auto'},
  {id:'SHT41_6', name:'보관장', t:22.1, h:80, mode:'auto'}
];
/* 임계치 */
const LIM={dewWarn:5, dewBad:3, hiWarn:31, hiBad:35, humWarn:70, humBad:80, tWarn:32, tBad:36};

/* 이슬점 (Magnus) */
function dewPoint(t,h){
  const a=17.62,b=243.12;
  const g=Math.log(h/100)+(a*t)/(b+t);
  return (b*g)/(a-g);
}
/* 체감온도 (열지수 간이식, 27℃ 미만은 기온) */
function heatIndex(t,h){
  if(t<27)return t;
  const T=t*9/5+32;
  let HI=-42.379+2.04901523*T+10.14333127*h-0.22475541*T*h
    -0.00683783*T*T-0.05481717*h*h+0.00122874*T*T*h
    +0.00085282*T*h*h-0.00000199*T*T*h*h;
  return (HI-32)*5/9;
}
function grade(z){
  if(z.off)return 'off';
  const d=z.t-dewPoint(z.t,z.h);
  const f=heatIndex(z.t,z.h);
  if(d<=LIM.dewBad||z.h>=LIM.humBad||f>=LIM.hiBad||z.t>=LIM.tBad)return 'bad';
  if(d<=LIM.dewWarn||z.h>=LIM.humWarn||f>=LIM.hiWarn||z.t>=LIM.tWarn)return 'warn';
  return 'ok';
}
const LBL={ok:'정상',warn:'주의',bad:'경고',off:'오프라인'};

/* 데모 변동 */
let TICK=0;
function drift(){
  ZONES.forEach((z,i)=>{
    z.t=Math.round((z.t+(Math.random()-.5)*0.30)*10)/10;
    z.h=Math.round((z.h+(Math.random()-.5)*1.1)*10)/10;
    z.t=Math.min(38,Math.max(15,z.t));
    z.h=Math.min(92,Math.max(30,z.h));
    z.hist=(z.hist||Array.from({length:14},()=>z.t));
    z.hist.push(z.t); if(z.hist.length>14)z.hist.shift();
    z.ago=Math.floor(Math.random()*40)+5;
    z.off=(i===4&&TICK%7>4);  // 데모: 가공실 간헐 오프라인
  });
  TICK++;
}
function agoTxt(s){return s<60?s+'초 전':Math.floor(s/60)+'분 전'}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML=ZONES.map(z=>{
    const gd=grade(z);
    const dew=z.t-dewPoint(z.t,z.h);
    const hi=heatIndex(z.t,z.h);
    const useDew=z.h>=62;                    // 습할 때는 결로여유, 아니면 체감
    const third=useDew
      ? {k:'결로여유', v:dew.toFixed(1), u:'℃', cls:dew<=LIM.dewBad?'bad':dew<=LIM.dewWarn?'warn':''}
      : {k:'체감',     v:hi.toFixed(1),  u:'℃', cls:hi>=LIM.hiBad?'bad':hi>=LIM.hiWarn?'warn':''};
    const mx=Math.max(...(z.hist||[z.t])),mn=Math.min(...(z.hist||[z.t]));
    const spark=(z.hist||[]).map(v=>{
      const p=mx===mn?50:((v-mn)/(mx-mn))*100;
      return `<i style="height:${Math.max(8,p)}%"></i>`;
    }).join('');
    return `<div class="sc ${z.off?'off':gd}">
      <div class="h">
        <span class="tag">${z.id}</span>
        <span class="nm">${z.name}</span>
        <span class="st ${z.off?'':gd}"><i></i>${z.off?'오프라인':LBL[gd]}</span>
      </div>
      <div class="vals">
        <div class="vl t"><div class="k">온도</div><div class="v">${z.t.toFixed(1)}<span>℃</span></div></div>
        <div class="vl h"><div class="k">습도</div><div class="v">${z.h.toFixed(1)}<span>%</span></div></div>
        <div class="vl f ${third.cls}"><div class="k">${third.k}</div><div class="v">${third.v}<span>${third.u}</span></div></div>
      </div>
      <div class="ft"><span class="spark">${spark}</span><span class="ago">${agoTxt(z.ago||0)}</span></div>
    </div>`;
  }).join('');

  const c={ok:0,warn:0,bad:0,off:0};
  ZONES.forEach(z=>{c[z.off?'off':grade(z)]++});
  document.getElementById('sum').innerHTML=`
    <div class="sum all"><div class="v">${ZONES.length}</div><div class="k">측정 구역</div></div>
    <div class="sum ok"><div class="v">${c.ok}</div><div class="k">정상</div></div>
    <div class="sum warn"><div class="v">${c.warn}</div><div class="k">주의</div></div>
    <div class="sum bad"><div class="v">${c.bad+c.off}</div><div class="k">경고 · 오프라인</div></div>`;
  document.getElementById('lv').textContent='실시간 '+new Date().toLocaleTimeString('ko-KR');
}

drift();render();
setInterval(()=>{drift();render()},5000);

/* ===== 표 → 엑셀 복사 (모든 .tscroll 테이블에 ⎘ 버튼 자동 부착) ===== */
(function(){
  function cellText(td){return td.innerText.replace(/[\t\n]+/g,' ').trim()}
  function tsv(tb){
    return [...tb.querySelectorAll('tr')]
      .map(tr=>[...tr.children].map(cellText).join('\t')).join('\n');
  }
  function attach(){
    document.querySelectorAll('.tscroll').forEach(w=>{
      if(w.querySelector('.tcopy'))return;
      const t=w.querySelector('table');if(!t)return;
      const b=document.createElement('button');
      b.type='button';b.className='tcopy';b.textContent='⎘ 표 복사';
      b.onclick=e=>{
        e.stopPropagation();
        const txt=tsv(t);
        const done=()=>{if(typeof toast==='function')toast('표를 복사했습니다 — 엑셀에 붙여넣기(Ctrl+V) 하세요')};
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(txt).then(done).catch(()=>{fallback(txt);done()});
        else{fallback(txt);done()}
      };
      w.appendChild(b);
    });
  }
  function fallback(txt){
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    ta.remove();
  }
  attach();
  new MutationObserver(()=>attach()).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
